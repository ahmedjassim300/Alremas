<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1F4D">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>مكتبة الريماس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F7FC;--card:#fff;--ink:#0F1F4D;--ink2:#41507A;--mute:#7481A3;--line:#DCE4F1;--rule:#EAF0F9;--pri:#1B3FA0;--pri2:#2A52C4;--priS:#E7EDFC;--onpri:#fff;--red:#D6344B;--redS:#FCE8EB;--hl:#FFE45C;--hlS:#FFF6C7;--ok:#1B8A5E;--okS:#DFF4EA;--warn:#B77400;--warnS:#FFF0D2;--side:#0F1F4D;--sideT:#BFCBEE;--sheet:#fff;--u:40px}
[data-theme=dark]{--paper:#0B1120;--card:#131B30;--ink:#E9EEFC;--ink2:#AAB6D8;--mute:#7885AB;--line:#25304E;--rule:#1B2440;--pri:#7C99FF;--pri2:#95AEFF;--priS:#1C2857;--onpri:#0B1230;--red:#FF6B80;--redS:#3A1822;--hl:#FFE45C;--hlS:#3A3410;--ok:#4FD3A0;--okS:#12332A;--warn:#F2B740;--warnS:#3A2E0E;--side:#080D1A;--sideT:#9FACD3;--sheet:#131B30}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip;max-width:100%}
body{overflow-x:clip;max-width:100%;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,h4,.brand,.disp{font-family:'Lalezar','IBM Plex Sans Arabic',Tahoma,sans-serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ic{flex:none}
.sp{flex:1}
.hide{display:none!important}
.mute{color:var(--mute)}.sm{font-size:.85rem}.b{font-weight:600}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.col1{display:flex;flex-direction:column;gap:.6rem}
/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:500;min-height:40px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.pri:hover{background:var(--pri2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.hl{background:var(--hl);border-color:var(--hl);color:#0F1F4D}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--priS)}
.btn.s{min-height:32px;padding:.2rem .65rem;font-size:.85rem}
.btn.ic1{padding:.4rem;min-width:36px}
.btn.lg{min-height:54px;font-size:1.15rem;padding:.7rem 1.4rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:.5rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:40px}
.in:focus{border-color:var(--pri);outline:2px solid var(--priS)}
textarea.in{min-height:80px;resize:vertical}
label.f{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:.85rem}
label.f>span{display:block;margin-bottom:.25rem;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .9rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;padding:.5rem .4rem;font-weight:500;font-size:.9rem;border-inline-start:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:.35rem}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--pri);color:var(--onpri)}
.chip{padding:.28rem .8rem;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.85rem;white-space:nowrap;display:inline-flex;gap:.35rem;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:thin}
.bd{display:inline-block;padding:.05rem .55rem;border-radius:6px;font-size:.78rem;font-weight:600;white-space:nowrap}
.bd.ok{background:var(--okS);color:var(--ok)}.bd.warn{background:var(--warnS);color:var(--warn)}.bd.red{background:var(--redS);color:var(--red)}.bd.pri{background:var(--priS);color:var(--pri)}.bd.mute{background:var(--rule);color:var(--ink2)}
/* app shell */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.side{background:var(--side);color:var(--sideT);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:1rem .7rem;z-index:60}
.side .brand{display:flex;align-items:center;gap:.6rem;font-size:1.45rem;color:#fff;padding:.2rem .6rem 1.1rem}
.side .brand .lg1{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--red);display:grid;place-items:center;border-inline-start:6px double var(--red)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:8px;color:var(--sideT);position:relative;font-weight:500}
.nav a:hover{color:#fff}
.nav a>*{position:relative;z-index:1}
.nav a.on{color:#0F1F4D}
.nav a.on::before{content:'';position:absolute;inset:3px 0;background:var(--hl);border-radius:5px 12px 6px 14px;transform:rotate(-.7deg)}
.nav .nb{margin-inline-start:auto;background:var(--red);color:#fff;font-size:.72rem;border-radius:99px;padding:0 .45rem;min-width:20px;text-align:center}
.sidef{border-top:1px solid rgba(255,255,255,.12);padding-top:.7rem;font-size:.82rem;display:flex;flex-direction:column;gap:.3rem}
.sidef a{display:flex;gap:.5rem;align-items:center;padding:.3rem .6rem;color:var(--sideT)}
.top{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.4rem;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:40}
.top h2{font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mainw{min-width:0}
.menu{display:none}
.main{padding:1.2rem 1.4rem 5rem;max-width:1500px;margin:0 auto}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .8rem;border-radius:99px;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--card)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px var(--okS)}
.pill.off i{background:var(--red)}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.ph1 h1{font-size:1.9rem;line-height:1.2}
/* cards, tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.card h3{font-size:1.15rem;margin-bottom:.6rem}
.cgrid{display:grid;gap:1rem}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.9rem;margin-bottom:1rem}
.kpi{padding:.9rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.kpi small{color:var(--mute);display:block}
.kpi b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.7rem;line-height:1.3;display:block}
.kpi.big{background:var(--side);border-color:var(--side);color:#fff;border-radius:16px 16px 4px 16px}
.kpi.big small{color:var(--sideT)}.kpi.big b{color:var(--hl);font-size:2.1rem}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;font-size:.8rem;color:var(--mute);text-align:start;padding:.6rem .85rem;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem .85rem;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--priS)}
td.e,th.e{text-align:end}
.tool{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem;align-items:center}
.tool .in{width:auto;min-width:200px;flex:1}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--mute)}
.empty .em{font-size:2.4rem;display:block;margin-bottom:.4rem}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.li:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--priS);color:var(--pri);display:grid;place-items:center;font-weight:600;flex:none}
/* modal + toast */
.mdl{position:fixed;inset:0;background:rgba(8,14,38,.55);display:grid;place-items:center;z-index:100;padding:1rem;overflow:auto}
.mbox{background:var(--card);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 2rem);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
.mbox.wide{width:min(880px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.1rem;border-bottom:1px solid var(--line)}
.mh h3{font-size:1.3rem}
.mb{padding:1.1rem;overflow:auto}
.mf{padding:.75rem 1.1rem;border-top:1px solid var(--line);display:flex;gap:.6rem;background:var(--paper);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#toasts{position:fixed;bottom:1rem;inset-inline:0;display:grid;justify-items:center;gap:.5rem;z-index:300;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:10px;font-weight:500;animation:pop .2s}
.toast.err{background:var(--red);color:#fff}.toast.ok{background:var(--ok);color:#fff}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--paper)}
.sheet{position:relative;background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0 calc(var(--u) - 1px),var(--line) calc(var(--u) - 1px) var(--u));border:1px solid var(--line);border-radius:6px 20px 20px 6px}
.sheet::before{content:'';position:absolute;inset-block:0;inset-inline-start:74px;width:5px;border-inline:1.5px solid var(--red);opacity:.65}
.sheet::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at calc(100% - 26px) 14%,var(--paper) 0 10px,#0000 11px),radial-gradient(circle at calc(100% - 26px) 50%,var(--paper) 0 10px,#0000 11px),radial-gradient(circle at calc(100% - 26px) 86%,var(--paper) 0 10px,#0000 11px)}
.authc{width:min(440px,100%);padding:2rem 2rem 1.6rem 3.4rem;padding-inline-start:104px;padding-inline-end:52px}
.authc h1{font-size:2.3rem;color:var(--pri);line-height:1.2;margin-bottom:.3rem}
.authc .in{background:rgba(255,255,255,.85)}[data-theme=dark] .authc .in{background:var(--card)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:1rem;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.7rem;margin-top:.7rem}
.pt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem;text-align:start;display:flex;flex-direction:column;gap:.25rem;position:relative;transition:border-color .12s,transform .08s}
.pt:hover{border-color:var(--pri)}.pt:active{transform:scale(.97)}
.pt .ph{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:center;font-size:2.3rem;background:var(--tint,var(--priS));overflow:hidden}
.pt .ph img{width:100%;height:100%;object-fit:cover}
.pt .nm{font-weight:600;font-size:.88rem;line-height:1.35;min-height:2.4em}
.pt .pr{font-family:'Lalezar',sans-serif;font-size:1.15rem;color:var(--pri)}
.pt .st{position:absolute;top:.75rem;inset-inline-end:.75rem}
.pt.out{opacity:.55}
.cartp{position:sticky;top:70px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 86px);overflow:hidden}
.cartp .ch{padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line)}
.cartp .ch h3{font-size:1.25rem}
.lines{position:relative;overflow:auto;min-height:110px;flex:1}
.lines::before{content:'';position:absolute;inset-block:0;inset-inline-start:38px;width:2px;background:var(--red);opacity:.35;pointer-events:none}
.cl{display:grid;grid-template-columns:auto 1fr auto auto;gap:.5rem;align-items:center;padding:.5rem .6rem;border-bottom:1px solid var(--rule)}
.cl .cn{min-width:0}.cl .cn b{display:block;font-size:.9rem;line-height:1.3}.cl .cn small{color:var(--mute)}
.qs{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qs button{width:28px;height:30px;font-size:1.1rem;background:var(--paper)}
.qs input{width:38px;text-align:center;border:0;background:var(--card);height:30px;font-weight:600}
.ct{font-weight:600;min-width:64px;text-align:end}
.cf{padding:.8rem .9rem;border-top:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:.55rem}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot.g b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.9rem;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%);padding:0 .35rem;color:var(--ink)}
[data-theme=dark] .tot.g b{color:#fff;background:linear-gradient(transparent 55%,rgba(255,228,92,.28) 55% 92%,transparent 92%)}
.cartbar{display:none}
.quick{display:flex;gap:.35rem;flex-wrap:wrap}
.quick button{padding:.2rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:.82rem}
/* tasks */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
.bcol{background:var(--rule);border-radius:14px;padding:.6rem;min-height:220px;transition:outline .1s}
.bcol.over{outline:2px dashed var(--pri);outline-offset:-2px}
.bcol h4{font-size:1.15rem;padding:.2rem .4rem .6rem;display:flex;justify-content:space-between;align-items:center}
.tk{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--pc,var(--line));border-radius:8px;padding:.6rem .75rem;margin-bottom:.5rem;cursor:grab;display:flex;flex-direction:column;gap:.35rem}
.tk:hover{border-color:var(--pri);border-inline-start-color:var(--pc)}
.tk.done .tt{text-decoration:line-through;color:var(--mute)}
.tk .tt{font-weight:600;line-height:1.4}
.tk .tm{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--mute)}
/* store */
.st-h{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem}
.st-h .brand{font-size:1.5rem;display:flex;align-items:center;gap:.5rem;color:var(--pri)}
.st-w{max-width:1200px;margin:0 auto;padding:1rem 1.2rem 4rem}
.hero{--u:40px;padding:2rem 1.5rem 2rem 2rem;padding-inline-start:124px;padding-inline-end:56px;margin-bottom:1.4rem;min-height:calc(var(--u)*8)}
.hero h1{font-size:clamp(2rem,5.2vw,3.7rem);line-height:calc(var(--u)*2);color:var(--pri);margin-top:calc(var(--u)*-.2)}
.hero p{line-height:var(--u);max-width:34rem;color:var(--ink2)}
.hero .row{margin-top:var(--u)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-top:1rem}
.sp1{display:flex;flex-direction:column;gap:.3rem}
.sp1 .ph{aspect-ratio:1;border-radius:14px 14px 4px 14px;display:grid;place-items:center;font-size:3.6rem;background:var(--tint,var(--priS));overflow:hidden;position:relative}
.sp1 .ph img{width:100%;height:100%;object-fit:cover}
.sp1 .nm{font-weight:600;line-height:1.35}
.sp1 .pr{font-family:'Lalezar',sans-serif;font-size:1.25rem;color:var(--pri)}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(420px,100%);background:var(--card);z-index:90;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(8,14,38,.35);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.wa{position:fixed;bottom:1rem;inset-inline-end:1rem;z-index:50;background:#25D366;color:#fff;border-radius:99px;padding:.65rem 1.1rem;font-weight:600;display:flex;gap:.4rem;align-items:center}
/* ===== store v2 ===== */
.st-tk{display:flex;height:36px;background:var(--side);color:#fff;font-size:12px;position:relative;z-index:45}
.st-tk .lb{background:var(--red);font-weight:800;display:flex;align-items:center;padding-inline:.8rem;gap:.35rem;flex:none}
.st-tk .vp{flex:1;overflow:hidden;min-width:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.st-tk .tr{display:flex;align-items:center;gap:2rem;height:100%;width:max-content;padding-inline:1rem;animation:tk 45s linear infinite}
.st-tk:hover .tr{animation-play-state:paused}
.st-tk .it{display:inline-flex;gap:.45rem;align-items:center;white-space:nowrap;font-weight:600}
.st-tk .it i{font-style:normal;background:var(--hl);color:#0F1F4D;border-radius:4px;padding:0 .4rem;font-size:10.5px;font-weight:800}
@keyframes tk{to{transform:translateX(50%)}}
.st-h{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.st-h .brand{font-size:1.45rem;display:flex;align-items:center;gap:.5rem;color:var(--pri);flex:none}
.lgm{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);border-inline-start:6px double var(--red);display:grid;place-items:center;color:var(--pri);flex:none}
.st-search{position:relative;flex:1;max-width:520px;min-width:0}
.st-search .in{padding-inline-start:2.6rem;padding-inline-end:4.8rem;border-radius:14px;background:var(--paper)}
.st-search .si{position:absolute;inset-inline-start:.8rem;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.st-search .btn{position:absolute;inset-inline-end:.3rem;top:50%;transform:translateY(-50%)}
.st-nav{display:flex;gap:.15rem;background:var(--rule);border-radius:99px;padding:.2rem;flex:none}
.st-nav button{padding:.3rem .85rem;border-radius:99px;font-weight:600;font-size:.86rem}
.st-nav button:hover{background:var(--card)}
.st-hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:1rem;background:var(--rule)}
.st-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.st-slides::-webkit-scrollbar{display:none}
.st-slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:2.6/1}
.st-slide img{width:100%;height:100%;object-fit:cover;display:block}
.st-dots{position:absolute;bottom:.6rem;inset-inline:0;display:flex;justify-content:center;gap:.35rem}
.st-dots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.65);transition:width .2s}
.st-dots button.on{width:22px;background:#fff}
.st-arr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#0F1F4D;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.st-info{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.8rem 1rem;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:1.6rem}
.st-sec{margin-bottom:2rem;scroll-margin-top:84px}
.st-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;margin-bottom:.8rem}
.st-sh h2{font-size:1.5rem;line-height:1.2}.st-sh small{color:var(--mute);display:block}
.st-rail{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:.6rem;scrollbar-width:thin}
.st-rail>*{flex:0 0 auto;scroll-snap-align:start}
.st-rail .sp1{width:172px}

/* ============ طبقة البيانات: محلي أو Firestore ============ */
const COLS=['products','sales','customers','tasks','users','expenses','shifts','payments','orders','settings','accounts','banners','reviews','quizq'];
const DB={mode:'local',c:{},subs:[],fs:null,watching:new Set(),err:'',errs:{},
n(c){return 'rm_'+c},
list(c){return this.c[c]||[]},
get(c,id){return this.list(c).find(x=>x.id===id)},
on(f){this.subs.push(f)},
emit(c){clearTimeout(this._t);this._t=setTimeout(()=>this.subs.forEach(f=>f(c)),60)},
loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})},
async init(){
  COLS.forEach(c=>this.c[c]=[]);
  let cfg=FIREBASE_CONFIG;try{cfg=cfg||JSON.parse(localStorage.rm_fbcfg||'null')}catch(e){}
  if(cfg&&cfg.projectId){
    try{
      const v='10.12.2';
      if(!window.firebase){await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)}
      if(!firebase.apps.length)firebase.initializeApp(cfg);
      this.fs=firebase.firestore();
      try{await this.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
      this.mode='cloud';
    }catch(e){console.warn(e);this.err='تعذّر الاتصال بـ Firebase — يعمل النظام محلياً على هذا الجهاز'}
  }
  if(this.mode==='local'){
    COLS.forEach(c=>{try{this.c[c]=JSON.parse(localStorage['rm_'+c]||'[]')}catch(e){this.c[c]=[]}});
    addEventListener('storage',e=>{const c=e.key&&e.key.startsWith('rm_')?e.key.slice(3):'';if(COLS.includes(c)){try{this.c[c]=JSON.parse(e.newValue||'[]')}catch(x){}this.emit(c)}});
  }
},
watch(cols){
  const ps=[];
  cols.forEach(c=>{
    if(this.watching.has(c))return;this.watching.add(c);
    if(this.mode!=='cloud')return;
    ps.push(new Promise(ok=>{
      let first=true;const done=()=>{if(first){first=false;ok()}};
      this.fs.collection(this.n(c)).onSnapshot(s=>{this.c[c]=s.docs.map(d=>({...d.data(),id:d.id,_fid:d.id}));done();this.emit(c)},e=>{console.warn(c,e.code);this.errs[c]=e.code||'error';done()});
      setTimeout(done,5000);
    }));
  });
  return Promise.all(ps);
},
clean(o){return JSON.parse(JSON.stringify(o))},
async fetch(c,id){
  if(this.mode==='cloud'){const d=await this.fs.collection(this.n(c)).doc(id).get();return d.exists?{...d.data(),id:d.id}:null}
  return this.get(c,id)||null;
},
async query(c,f,v){
  if(this.mode==='cloud'){const q=await this.fs.collection(this.n(c)).where(f,'==',v).get();return q.docs.map(d=>({...d.data(),id:d.id}))}
  return this.list(c).filter(x=>x[f]===v);
},
async legacy(name){
  if(this.mode!=='cloud')throw new Error('يتطلب الربط بـ Firebase');
  const q=await this.fs.collection(name).get();return q.docs.map(d=>({...d.data(),_id:d.id}));
},
persist(c){try{localStorage['rm_'+c]=JSON.stringify(this.c[c])}catch(e){toast('امتلأت مساحة التخزين المحلي — اربط Firebase أو احذف الصور','err')}},
save(c,o){
  o=this.clean(o);o.id=o.id||uid();o._fid=o.id;o.updatedAt=Date.now();o.createdAt=o.createdAt||o.updatedAt;
  if(this.mode==='cloud'){this.fs.collection(this.n(c)).doc(o.id).set(o,{merge:true}).catch(e=>toast('تعذّر الحفظ: '+(e.code||e.message),'err'))}
  else{const a=this.list(c),i=a.findIndex(x=>x.id===o.id);if(i<0)a.push(o);else a[i]={...a[i],...o};this.c[c]=a;this.persist(c);this.emit(c)}
  return o;
},
remove(c,id){
  if(this.mode==='cloud')this.fs.collection(this.n(c)).doc(id).delete().catch(e=>toast('تعذّر الحذف: '+(e.code||e.message),'err'));
  else{this.c[c]=this.list(c).filter(x=>x.id!==id);this.persist(c);this.emit(c)}
},
/* ops: {t:'set',col,doc} | {t:'inc',col,id,f:{field:delta}} | {t:'del',col,id} */
batch(ops){
  if(this.mode==='cloud'){
    const F=firebase.firestore.FieldValue;
    for(let i=0;i<ops.length;i+=400){
      const b=this.fs.batch();
      ops.slice(i,i+400).forEach(p=>{
        const r=this.fs.collection(this.n(p.col)).doc(p.id||p.doc.id);
        if(p.t==='set'){const d=this.clean(p.doc);d._fid=d.id;d.updatedAt=Date.now();b.set(r,d,{merge:true})}
        else if(p.t==='inc'){const u={};for(const k in p.f)u[k]=F.increment(p.f[k]);b.set(r,u,{merge:true})}
        else if(p.t==='del')b.delete(r);
      });
      b.commit().catch(e=>toast('تعذّر الحفظ: '+(e.code||e.message),'err'));
    }
    return;
  }
  const touched=new Set();
  ops.forEach(p=>{
    const a=this.list(p.col);touched.add(p.col);
    if(p.t==='set'){const d=this.clean(p.doc);d._fid=d.id;d.updatedAt=Date.now();const i=a.findIndex(x=>x.id===d.id);if(i<0)a.push(d);else a[i]={...a[i],...d}}
    else if(p.t==='inc'){const x=a.find(x=>x.id===p.id);if(x)for(const k in p.f)x[k]=(x[k]||0)+p.f[k]}
    else if(p.t==='del')this.c[p.col]=a.filter(x=>x.id!==p.id);
  });
  touched.forEach(c=>this.persist(c));this.emit();
}};

async legacyHash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')},
async hash(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256);
  return 'p1$'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
},
async verify(pw,rec){
  if(!rec||!rec.salt||!rec.pass)return false;
  return String(rec.pass).startsWith('p1$')?(await this.hash(pw,rec.salt))===rec.pass:(await this.legacyHash(pw,rec.salt))===rec.pass;
},
async setupHash(code){const c=String(code).replace(/[\s-]/g,'').toUpperCase(),b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('alremas-setup:'+c));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')},
async setupOk(code){return !!SETUP_HASH&&(await this.setupHash(code))===SETUP_HASH},
async login(u,p){
  const usr=DB.list('users').find(x=>x.username===normU(u)&&x.active!==false&&x.salt&&x.pass);
  if(!usr||!(await this.verify(p,usr)))return false;
  if(!String(usr.pass).startsWith('p1$')){const salt=uid();usr.salt=salt;usr.pass=await this.hash(p,salt);DB.save('users',usr)}
  this.user=usr;localStorage.rm_sess=JSON.stringify({id:usr.id,t:Date.now()});return true;
},
restore(){try{const s=JSON.parse(localStorage.rm_sess||'null');if(s&&Date.now()-s.t<12*36e5){const u=DB.get('users',s.id);if(u&&u.active!==false){this.user=u;return true}}}catch(e){}return false},
logout(){this.user=null;localStorage.removeItem('rm_sess')},
async make(name,username,role,pw,extra={}){const salt=uid();return{...extra,name,username:normU(username),role,salt,pass:await this.hash(pw,salt),active:true}},
isAdmin(){return this.user&&this.user.role==='admin'}};

function closeModal(el){if(!el)return;el.remove();if(el._close)el._close();if(!$$('.mdl').length)setTimeout(()=>window.onData&&onData(),50)}
function modal(o){

  el.addEventListener('mousedown',e=>{if(e.target===el&&!o.sticky)closeModal(el)});

const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}

const Q={
sales:(a=0,b=Infinity)=>DB.list('sales').filter(s=>s.status!=='refunded'&&s.ts>=a&&s.ts<b),
agg(l){let total=0,cost=0,disc=0;l.forEach(s=>{total+=s.total;disc+=s.discount||0;s.items.forEach(i=>cost+=(i.cost||0)*i.qty)});return{total,cost,disc,n:l.length,profit:total-cost,avg:l.length?total/l.length:0}},
low:()=>DB.list('products').filter(p=>p.active!==false&&!p.service&&!p.onRequest&&(p.stock||0)<=(p.min??S().low)),
debts:()=>DB.list('customers').reduce((a,c)=>a+Math.max(0,c.balance||0),0),
shift:()=>DB.list('shifts').find(s=>s.status==='open'),
userName:id=>(DB.get('users',id)||{}).name||'—',
cashFx:s=>s.method==='cash'?s.total:s.method==='credit'?(s.paid||0):0};
function shiftCalc(sh){
  const ss=DB.list('sales').filter(s=>s.shiftId===sh.id&&s.status!=='refunded');
  const r={opening:sh.opening||0,n:ss.length,total:0,cash:0,transfer:0,credit:0,down:0,debtPay:0,ins:0,outs:0};
  ss.forEach(s=>{r.total+=s.total;if(s.method==='cash')r.cash+=s.total;else if(s.method==='transfer')r.transfer+=s.total;else{r.credit+=s.due||0;r.down+=s.paid||0}});
  DB.list('payments').filter(p=>p.shiftId===sh.id&&p.method==='cash').forEach(p=>r.debtPay+=p.amount);
  (sh.moves||[]).forEach(m=>{if(m.type==='in')r.ins+=m.amount;else r.outs+=m.amount});
  r.expected=r.opening+r.cash+r.down+r.debtPay+r.ins-r.outs;
  return r;
}

Act.openShift=()=>{
  if(Q.shift())return Act.shift();
  const last=DB.list('shifts').filter(s=>s.status==='closed').sort((a,b)=>b.closedAt-a.closedAt)[0];
  const m=modal({title:'فتح الوردية',body:`<form id="f1"><label class="f"><span>النقد الافتتاحي في الدرج (${S().cur})</span><input class="in" name="open" inputmode="numeric" value="${last?last.counted:0}" required></label><p class="sm mute">عدّ النقد الموجود فعلياً قبل البدء. سيُقارن به عند إغلاق الوردية.</p></form>`,foot:`<button class="btn pri" form="f1">فتح الوردية</button>`});
  form(m,d=>{DB.save('shifts',{status:'open',openedAt:Date.now(),by:Auth.user.id,byName:Auth.user.name,opening:num(d.open),moves:[]});toast('تم فتح الوردية','ok')});
};
Act.shift=()=>{
  const sh=Q.shift();if(!sh)return Act.openShift();
  const c=shiftCalc(sh),row=(a,b,cl='')=>`<tr><td>${a}</td><td class="e ${cl}">${b}</td></tr>`;
  const m=modal({title:'الصندوق — الوردية الحالية',wide:1,body:`<div class="cgrid c2"><div><div class="mute sm" style="margin-bottom:.4rem">بدأت ${tm(sh.openedAt)} • ${esc(sh.byName||'')}</div>
  <div class="tblw"><table><tbody>${row('النقد الافتتاحي',fmt(c.opening))}${row('مبيعات نقدية (+)',fmt(c.cash))}${row('دفعات مقدمة على فواتير آجلة (+)',fmt(c.down))}${row('تسديد ديون عملاء (+)',fmt(c.debtPay))}${row('إيداعات (+)',fmt(c.ins))}${row('سحوبات ومصروفات (−)',fmt(c.outs))}
  <tr style="background:var(--hlS)"><td class="b">النقد المتوقع في الدرج</td><td class="e b" style="font-size:1.2rem">${fmt(c.expected)} ${S().cur}</td></tr></tbody></table></div></div>
  <div><div class="tblw"><table><tbody>${row('عدد الفواتير',c.n)}${row('إجمالي المبيعات',fmt(c.total))}${row('تحويل إلكتروني',fmt(c.transfer))}${row('آجل (ديون جديدة)',fmt(c.credit))}</tbody></table></div>
  <h4 style="margin:.9rem 0 .3rem;font-size:1.05rem">حركات الدرج</h4>${(sh.moves||[]).length?`<div class="list">${sh.moves.map(x=>`<div class="li"><span class="bd ${x.type==='in'?'ok':'red'}">${x.type==='in'?'إيداع':'سحب'}</span><span style="flex:1">${esc(x.reason||'')}<span class="sm mute"> • ${tm(x.ts)}</span></span><b>${fmt(x.amount)}</b></div>`).join('')}</div>`:'<div class="sm mute">لا حركات بعد</div>'}</div></div>`,
  foot:`<button class="btn red" data-act="closeShift">إغلاق الوردية</button><button class="btn" data-act="move" data-type="in">${I('plus',16)}إيداع</button><button class="btn" data-act="move" data-type="out">${I('minus',16)}سحب / مصروف</button><button class="btn" data-act="printZ">${I('print',16)}طباعة</button>`});
  m.dataset.shift=sh.id;
};
Act.move=el=>{
  const sh=Q.shift(),type=el.dataset.type;if(!sh)return;
  const m=modal({title:type==='in'?'إيداع نقد في الدرج':'سحب نقد من الدرج',body:`<form id="f2"><label class="f"><span>المبلغ (${S().cur})</span><input class="in" name="a" inputmode="numeric" required></label><label class="f"><span>السبب</span><input class="in" name="r" placeholder="${type==='in'?'مثال: فكّة':'مثال: شراء أكياس، توصيل'}" required></label></form>`,foot:`<button class="btn pri" form="f2">حفظ</button>`});
  form(m,d=>{const a=num(d.a);if(a<=0){toast('أدخل مبلغاً صحيحاً','err');return false}
    DB.save('shifts',{...sh,moves:[...(sh.moves||[]),{ts:Date.now(),type,amount:a,reason:d.r,by:Auth.user.name}]});
    closeModal(el.closest('.mdl'));setTimeout(Act.shift,350)});
};
Act.closeShift=el=>{
  const sh=Q.shift();if(!sh)return;const c=shiftCalc(sh);
  const m=modal({title:'إغلاق الوردية',body:`<form id="f3"><div class="kpi" style="margin-bottom:1rem"><small>النقد المتوقع</small><b>${fmt(c.expected)} ${S().cur}</b></div>
  <label class="f"><span>النقد الفعلي بعد العدّ (${S().cur})</span><input class="in" name="cnt" inputmode="numeric" data-in="diff" data-exp="${c.expected}" required></label>
  <div id="dv" class="b" style="margin-bottom:.8rem"></div><label class="f"><span>ملاحظات (اختياري)</span><input class="in" name="note"></label></form>`,foot:`<button class="btn red" form="f3">إغلاق الوردية</button><button class="btn" data-act="close">رجوع</button>`});
  form(m,d=>{const cnt=num(d.cnt),nsh={...sh,status:'closed',closedAt:Date.now(),closedBy:Auth.user.name,expected:c.expected,counted:cnt,diff:cnt-c.expected,note:d.note||''};
    DB.save('shifts',nsh);$$('.mdl').forEach(closeModal);
    modal({title:'تم إغلاق الوردية',body:`<p>الفرق بين العدّ الفعلي والمتوقع: <b style="color:${nsh.diff?'var(--red)':'var(--ok)'}">${nsh.diff>0?'+':''}${fmt(nsh.diff)} ${S().cur}</b></p>`,foot:`<button class="btn pri" data-act="printZ" data-id="${sh.id}">${I('print',16)}طباعة تقرير الوردية</button><button class="btn" data-act="close">تم</button>`});return false});
};
In.diff=el=>{const d=num(el.value)-num(el.dataset.exp);$('#dv').innerHTML=el.value===''?'':`الفرق: <span style="color:${d?'var(--red)':'var(--ok)'}">${d>0?'+':''}${fmt(d)}</span>${d?'':' ✓ مطابق'}`};
function printHTML(h){$('#print').innerHTML=h;setTimeout(()=>window.print(),120)}
Act.printZ=el=>{
  const id=el.dataset.id||(el.closest('.mdl')||{dataset:{}}).dataset.shift;const sh=DB.get('shifts',id)||Q.shift();if(!sh)return;
  const c=shiftCalc(sh),r=(a,b)=>`<div class="t"><span>${a}</span><span>${fmt(b)}</span></div>`;
  printHTML(`<div class="rc"><h2>${esc(S().name)}</h2><div class="c">تقرير الوردية</div><hr>
  <div>الموظف: ${esc(sh.byName||'')}</div><div>البداية: ${dt(sh.openedAt)} ${tm(sh.openedAt)}</div>${sh.closedAt?`<div>النهاية: ${dt(sh.closedAt)} ${tm(sh.closedAt)}</div>`:''}<hr>
  ${r('عدد الفواتير',c.n)}${r('إجمالي المبيعات',c.total)}${r('نقدي',c.cash)}${r('تحويل',c.transfer)}${r('آجل',c.credit)}<hr>
  ${r('النقد الافتتاحي',c.opening)}${r('+ مبيعات نقدية',c.cash)}${r('+ دفعات مقدمة',c.down)}${r('+ تسديد ديون',c.debtPay)}${r('+ إيداعات',c.ins)}${r('− سحوبات',c.outs)}<hr>
  <div class="t g"><span>المتوقع</span><span>${fmt(c.expected)}</span></div>${sh.status==='closed'?`${r('المعدود فعلياً',sh.counted)}<div class="t g"><span>الفرق</span><span>${fmt(sh.diff)}</span></div>`:''}</div>`);
};

/* ============ الصندوق (نقطة البيع) ============ */
const POS={cart:[],disc:0,dtype:'amt',cust:null,method:'cash',tender:'',down:0,q:'',cat:'all',orderId:null,busy:false};
const held=()=>{try{return JSON.parse(localStorage.rm_held||'[]')}catch(e){return[]}};
const setHeld=h=>{localStorage.rm_held=JSON.stringify(h)};
function resetPos(){Object.assign(POS,{cart:[],disc:0,dtype:'amt',cust:null,method:'cash',tender:'',down:0,orderId:null,busy:false})}
function posTot(){
  const sub=POS.cart.reduce((a,l)=>a+l.price*l.qty,0);
  let d=POS.dtype==='pct'?sub*Math.min(POS.disc,100)/100:POS.disc;
  d=Math.round(Math.min(Math.max(d||0,0),sub));
  return{sub,d,total:sub-d};
}
function posList(){
  const q=POS.q.trim().toLowerCase(),sold={},from=Date.now()-30*DAY;
  DB.list('sales').forEach(s=>{if(s.ts>from)s.items.forEach(i=>sold[i.pid]=(sold[i.pid]||0)+i.qty)});
  return DB.list('products').filter(p=>p.active!==false&&(POS.cat==='all'||p.cat===POS.cat)&&(!q||p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q)))
    .sort((a,b)=>(sold[b.id]||0)-(sold[a.id]||0)||a.name.localeCompare(b.name,'ar'));
}
function paintCats(){
  const el=$('#pcats');if(!el)return;
  const used=new Set(DB.list('products').map(p=>p.cat));
  el.innerHTML=`<button class="chip ${POS.cat==='all'?'on':''}" data-act="pcat" data-id="all">الكل</button>`+S().cats.filter(c=>used.has(c.id)).map(c=>`<button class="chip ${POS.cat===c.id?'on':''}" data-act="pcat" data-id="${c.id}">${c.e} ${esc(c.n)}</button>`).join('');
}
function paintGrid(){
  const el=$('#pgrid');if(!el)return;
  const l=posList();
  el.innerHTML=l.slice(0,150).map(p=>{
    const c=catOf(p.cat),st=p.stock||0,cls=st<=0?'red':st<=(p.min??S().low)?'warn':'mute';
    return `<button class="pt ${!p.service&&st<=0?'out':''}" data-act="padd" data-id="${p.id}"><div class="ph" style="--tint:${c.c}">${p.img?`<img src="${p.img}" alt="" loading="lazy">`:c.e}</div><div class="nm">${esc(p.name)}</div><div class="pr">${fmt(p.price)}</div>${p.service?'':`<span class="st bd ${cls}">${st<=0?'نفد':st}</span>`}</button>`;
  }).join('')||`<div style="grid-column:1/-1">${empty('🔍','لا نتائج',DB.list('products').length?'جرّب كلمة أخرى أو قسماً آخر':'أضف منتجات من صفحة المنتجات')}</div>`;
}
function padd(p,q=1){
  const l=POS.cart.find(x=>x.pid===p.id),n=(l?l.qty:0)+q;
  if(!p.service&&n>(p.stock||0))toast(`تنبيه: المتوفر من «${p.name}» ${p.stock||0} فقط`,'err');
  if(l)l.qty=n;else POS.cart.push({pid:p.id,name:p.name,price:p.price,cost:p.cost||0,qty:q,service:!!p.service});
  paintCart();
}
function cartHTML(){
  const t=posTot(),c=POS.cust&&DB.get('customers',POS.cust),m=POS.method,cur=S().cur;
  const lines=POS.cart.map((l,i)=>`<div class="cl"><button class="btn ic1 s ghost" data-act="crm" data-i="${i}" aria-label="حذف" style="color:var(--red)">${I('x',16)}</button>
  <div class="cn"><b>${esc(l.name)}</b><small><button data-act="lprice" data-i="${i}" style="text-decoration:underline dotted;color:inherit">${fmt(l.price)}</button> × ${l.qty}</small></div>
  <div class="qs"><button data-act="qm" data-i="${i}" aria-label="أنقص">−</button><input value="${l.qty}" inputmode="decimal" data-ch="qty" data-i="${i}" aria-label="الكمية"><button data-act="qp" data-i="${i}" aria-label="زد">+</button></div>
  <div class="ct">${fmt(l.price*l.qty)}</div></div>`).join('');
  const tender=POS.tender===''?t.total:num(POS.tender),chg=tender-t.total;
  const quick=[...new Set([t.total,...[1000,5000,10000,25000,50000,100000].map(u=>Math.ceil(t.total/u)*u)])].filter(x=>x>0).slice(0,5);
  let pay='';
  if(m==='cash')pay=`<label class="f" style="margin:0"><span class="sm">المبلغ المستلم</span><input class="in" id="tnd" inputmode="numeric" data-in="tender" value="${POS.tender}" placeholder="${fmt(t.total)}"></label>
  <div class="quick">${quick.map(x=>`<button data-act="tq" data-v="${x}">${x===t.total?'بالضبط':fmt(x)}</button>`).join('')}</div>
  <div class="tot"><span class="mute">الباقي للزبون</span><b id="chg" style="color:${chg<0?'var(--red)':'var(--ok)'}">${fmt(Math.max(chg,0))}</b></div>`;
  else if(m==='credit')pay=c?`<label class="f" style="margin:0"><span class="sm">دفعة مقدمة الآن (اختياري)</span><input class="in" inputmode="numeric" data-in="down" value="${POS.down||''}" placeholder="0"></label><div class="tot"><span class="mute">يُضاف إلى دين ${esc(c.name)}</span><b id="dueamt">${fmt(t.total-Math.min(POS.down||0,t.total))}</b></div>`:`<div class="sm" style="color:var(--red)">اختر العميل أولاً لتسجيل البيع الآجل</div>`;
  return `<div class="ch"><h3>الفاتورة</h3><span class="sp"></span><button class="btn s ghost" data-act="hold">${I('pause',15)}تعليق</button><button class="btn s ghost" data-act="cclear" aria-label="تفريغ">${I('trash',15)}</button><button class="btn s ghost cartclose" data-act="cartToggle" aria-label="إخفاء" style="display:${innerWidth<=1100?'inline-flex':'none'}">${I('x',15)}</button></div>
  <div class="lines">${lines||empty('🛒','السلة فارغة','اضغط على منتج أو امسح الباركود')}</div>
  <div class="cf"><div class="row"><button class="btn s" data-act="pcust">${I('user',15)}${c?esc(c.name):'زبون عام'}</button><button class="btn s" data-act="pdisc">${I('tag',15)}${t.d?'خصم '+fmt(t.d):'خصم'}</button></div>
  ${t.d?`<div class="tot"><span class="mute">المجموع قبل الخصم</span><span>${fmt(t.sub)}</span></div>`:''}
  <div class="tot g"><span class="b">الإجمالي</span><b>${fmt(t.total)} <small style="font-size:.9rem">${cur}</small></b></div>
  <div class="seg"><button class="${m==='cash'?'on':''}" data-act="pm" data-m="cash">${I('cash',16)}نقد</button><button class="${m==='transfer'?'on':''}" data-act="pm" data-m="transfer">${I('phone',16)}تحويل</button><button class="${m==='credit'?'on':''}" data-act="pm" data-m="credit">${I('clock',16)}آجل</button></div>
  ${pay}<button class="btn pri lg" data-act="pay" ${POS.cart.length?'':'disabled'}>إتمام البيع <span class="sm" style="opacity:.7">F9</span></button></div>`;
}
function paintCart(){
  const el=$('#cartp');if(!el)return;
  el.innerHTML=cartHTML();
  const n=POS.cart.reduce((a,l)=>a+l.qty,0),t=posTot(),bar=$('#cartbar');
  if(bar)bar.innerHTML=`<span>${I('cart',20)} السلة (${n})</span><b>${fmt(t.total)} ${S().cur}</b>`;
}
V.pos={t:'الصندوق',html(){
  if(!Q.shift())return `<div class="card" style="max-width:520px;margin:2rem auto;text-align:center;padding:2rem"><div style="font-size:3rem">🔒</div><h3 style="font-size:1.6rem">الصندوق مغلق</h3><p class="mute" style="margin:.4rem 0 1.2rem">افتح الوردية وأدخل النقد الموجود في الدرج لتبدأ البيع.</p><button class="btn pri lg" data-act="openShift">فتح الوردية</button></div>`;
  return `<div class="pos"><section><div class="tool" style="margin-bottom:.5rem"><input id="pq" class="in" data-in="pq" placeholder="ابحث بالاسم أو امسح الباركود (F2)" autocomplete="off" value="${esc(POS.q)}"><button class="btn" data-act="held">${I('pause',16)}المعلّقة${held().length?` (${held().length})`:''}</button></div>
  <div class="chips" id="pcats"></div><div class="pgrid" id="pgrid"></div></section><aside class="cartp" id="cartp"></aside></div><button class="cartbar" id="cartbar" data-act="cartToggle"></button>`;
},
mount(){
  if(!Q.shift())return;
  paintCats();paintGrid();paintCart();
  const q=$('#pq');
  q.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;e.preventDefault();
    const v=q.value.trim();if(!v)return;
    const ps=DB.list('products').filter(p=>p.active!==false);
    const ex=ps.find(p=>p.barcode&&p.barcode===v),l=posList();
    const p=ex||(l.length===1?l[0]:null);
    if(p){padd(p);q.value='';POS.q='';paintGrid()}else toast('لم يُعثر على المنتج','err');
  });
  if(innerWidth>1100)q.focus();
}};
document.addEventListener('keydown',e=>{
  if(VIEW!=='pos'||!Auth.user||$$('.mdl').length)return;
  if(e.key==='F2'){e.preventDefault();const q=$('#pq');q&&q.focus()}
  if(e.key==='F9'){e.preventDefault();Act.pay()}
});
In.pq=el=>{POS.q=el.value;paintGrid()};
In.tender=el=>{
  POS.tender=el.value;const t=posTot(),chg=(el.value===''?t.total:num(el.value))-t.total,c=$('#chg');
  if(c){c.textContent=fmt(Math.max(chg,0));c.style.color=chg<0?'var(--red)':'var(--ok)'}
};
In.down=el=>{POS.down=num(el.value);const t=posTot(),d=$('#dueamt');if(d)d.textContent=fmt(t.total-Math.min(POS.down,t.total))};
In.qty=el=>{const i=+el.dataset.i,q=num(el.value);if(q<=0)POS.cart.splice(i,1);else POS.cart[i].qty=q;paintCart()};
Act.pcat=el=>{POS.cat=el.dataset.id;paintCats();paintGrid()};
Act.padd=el=>{const p=DB.get('products',el.dataset.id);if(p)padd(p)};
Act.qp=el=>{POS.cart[+el.dataset.i].qty++;paintCart()};
Act.qm=el=>{const i=+el.dataset.i;if(--POS.cart[i].qty<=0)POS.cart.splice(i,1);paintCart()};

Act.recall=el=>{
  let h=held();const x=h.find(k=>k.id===el.dataset.id);if(!x)return;

Act.pay=()=>{
  if(!POS.cart.length||POS.busy)return;
  const sh=Q.shift();if(!sh){toast('افتح الوردية أولاً','err');return Act.openShift()}
  const t=posTot(),m=POS.method;let paid=0,due=0,tender=0,change=0;
  if(m==='cash'){tender=POS.tender===''?t.total:num(POS.tender);if(tender<t.total){toast('المبلغ المستلم أقل من الإجمالي','err');return}paid=t.total;change=tender-t.total}
  else if(m==='transfer'){paid=t.total}
  else{if(!POS.cust){toast('اختر العميل للبيع الآجل','err');return}paid=Math.min(POS.down||0,t.total);due=t.total-paid}
  POS.busy=true;
  const cu=POS.cust&&DB.get('customers',POS.cust),no=Math.max(0,...DB.list('sales').map(s=>s.no||0))+1;
  const sale={id:uid(),no,ts:Date.now(),by:Auth.user.id,byName:Auth.user.name,shiftId:sh.id,
    items:POS.cart.map(l=>({pid:l.pid,name:l.name,qty:l.qty,price:l.price,cost:l.cost,service:l.service})),
    subtotal:t.sub,discount:t.d,total:t.total,method:m,paid,due,tender,change,custId:cu?cu.id:'',custName:cu?cu.name:'',orderId:POS.orderId||'',status:'ok'};
  const ops=[{t:'set',col:'sales',doc:sale}];
  sale.items.filter(i=>!i.service).forEach(i=>{if(DB.get('products',i.pid))ops.push({t:'inc',col:'products',id:i.pid,f:{stock:-i.qty}})});
  if(due>0&&cu)ops.push({t:'inc',col:'customers',id:cu.id,f:{balance:due}});
  if(POS.orderId){const o=DB.get('orders',POS.orderId);if(o)ops.push({t:'set',col:'orders',doc:{...o,status:'done',saleId:sale.id}})}
  DB.batch(ops);
  resetPos();paintCart();paintGrid();
  showReceipt(sale,true);
};

const PF={q:'',cat:'all',st:'all'};
function prodFilter(){
  const q=PF.q.trim().toLowerCase();
  return DB.list('products').filter(p=>(PF.cat==='all'||p.cat===PF.cat)&&(!q||p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q))&&
   (PF.st==='all'||(PF.st==='low'&&!p.service&&(p.stock||0)>0&&p.stock<=(p.min??S().low))||(PF.st==='out'&&!p.service&&(p.stock||0)<=0)||(PF.st==='srv'&&p.service)||(PF.st==='off'&&p.active===false)))
   .sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}
function paintProducts(){
  const el=$('#ptbl');if(!el)return;const adm=Auth.isAdmin(),l=prodFilter();
  el.innerHTML=l.length?`<div class="tblw"><table><thead><tr><th></th><th>المنتج</th><th>القسم</th>${adm?'<th class="e">التكلفة</th>':''}<th class="e">السعر</th>${adm?'<th class="e">الهامش</th>':''}<th class="e">المخزون</th><th></th></tr></thead><tbody>${l.slice(0,300).map(p=>{
    const c=catOf(p.cat),st=p.stock||0,cls=st<=0?'red':st<=(p.min??S().low)?'warn':'ok';
    return `<tr class="${p.active===false?'mute':''}"><td style="width:52px"><div style="width:42px;height:42px;border-radius:8px;background:${c.c};display:grid;place-items:center;font-size:1.4rem;overflow:hidden">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:c.e}</div></td>
    <td><b>${esc(p.name)}</b>${p.active===false?' <span class="bd mute">مخفي</span>':''}<div class="sm mute">${esc(p.barcode||'')}${p.unit?' • '+esc(p.unit):''}</div></td><td>${esc(c.n)}</td>${adm?`<td class="e">${fmt(p.cost)}</td>`:''}<td class="e b">${fmt(p.price)}</td>
    ${adm?`<td class="e">${p.price?Math.round((p.price-(p.cost||0))/p.price*100)+'%':'—'}</td>`:''}<td class="e">${p.service?'<span class="bd mute">خدمة</span>':`<span class="bd ${cls}">${st}</span>`}</td>
    <td class="e" style="white-space:nowrap">${p.service?'':`<button class="btn s" data-act="pstock" data-id="${p.id}" title="استلام بضاعة أو جرد">${I('plus',14)}مخزون</button> `}<button class="btn s ghost ic1" data-act="pedit" data-id="${p.id}" aria-label="تعديل">${I('edit',16)}</button>${adm?`<button class="btn s ghost ic1" data-act="pdel" data-id="${p.id}" aria-label="حذف" style="color:var(--red)">${I('trash',16)}</button>`:''}</td></tr>`;
  }).join('')}</tbody></table></div>${l.length>300?`<p class="sm mute" style="margin-top:.5rem">يعرض أول 300 نتيجة — ضيّق البحث لرؤية المزيد.</p>`:''}`:empty('📦',DB.list('products').length?'لا نتائج مطابقة':'لا توجد منتجات بعد','أضف منتجك الأول أو استورد قائمتك من ملف CSV');
}

const resizeImg=(file,max=240)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)});

  foot:`<button class="btn pri" form="fp">حفظ</button><button class="btn" data-act="close">إلغاء</button>`,wide:0});

const RF={p:'month',from:'',to:''};
function rRange(){
  const t=sod(),d=new Date(),ms=new Date(d.getFullYear(),d.getMonth(),1).getTime();
  switch(RF.p){case'today':return[t,t+DAY];case'yest':return[t-DAY,t];case'7':return[t-6*DAY,t+DAY];
    case'month':return[ms,t+DAY];case'last':return[new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),ms];
    default:return[new Date((RF.from||ymd(t))+'T00:00').getTime(),new Date((RF.to||ymd(t))+'T00:00').getTime()+DAY]}
}

  const g=(fn)=>{const m={};sales.forEach(s=>fn(s,m));return Object.entries(m).sort((x,y)=>y[1].v-x[1].v)};
  const byCat=(()=>{const m={};sales.forEach(s=>s.items.forEach(i=>{const p=DB.get('products',i.pid),k=i.pid==='ship'?'رسوم التوصيل':p?catOf(p.cat).n:'غير مصنّف';m[k]=(m[k]||0)+i.qty*i.price}));return Object.entries(m).sort((x,y)=>y[1]-x[1])})();
  const byPay=g((s,m)=>{const k=methodName[s.method];(m[k]=m[k]||{v:0}).v+=s.total});
  const byUser=g((s,m)=>{const k=s.byName||'—';(m[k]=m[k]||{v:0,n:0}).v+=s.total;m[k].n++});
  const byDay=(()=>{const m={};sales.forEach(s=>{const k=ymd(s.ts);m[k]=m[k]||{v:0,n:0,p:0};m[k].v+=s.total;m[k].n++;m[k].p+=s.total-s.items.reduce((x,i)=>x+(i.cost||0)*i.qty,0)});return Object.entries(m).sort((x,y)=>y[0]<x[0]?-1:1)})();

  const top=Object.values(prod).sort((x,y)=>y.v-x.v).slice(0,10);
  const P=[['today','اليوم'],['yest','أمس'],['7','آخر 7 أيام'],['month','هذا الشهر'],['last','الشهر الماضي'],['custom','فترة مخصصة']];

Act.fbsave=()=>{

function userModal(u){
  const n=!u;u=u||{role:'cashier',active:true};
  const m=modal({title:n?'مستخدم جديد':'تعديل المستخدم',body:`<form id="fu"><label class="f"><span>الاسم</span><input class="in" name="n" value="${esc(u.name||'')}" required></label><div class="g2"><label class="f"><span>اسم المستخدم <small class="mute">(عربي أو رقم هاتف)</small></span><input class="in" name="u" value="${esc(u.username||'')}" autocapitalize="off" required></label><label class="f"><span>الصلاحية</span><select class="in" name="r">${opts(Object.entries(ROLES),u.role)}</select></label></div>
  <label class="f"><span>${n?'كلمة المرور':'كلمة مرور جديدة (اتركها فارغة للإبقاء)'}</span><input class="in" name="p" type="password" minlength="6" ${n?'required':''} autocomplete="new-password"></label><label class="row" style="gap:.4rem"><input type="checkbox" name="a" ${u.active!==false?'checked':''}> الحساب فعّال</label></form>`,foot:`<button class="btn pri" form="fu">حفظ</button><button class="btn" data-act="close">إلغاء</button>`});
  form(m,async d=>{
    const un=normU(d.u);
    if(DB.list('users').some(x=>x.username===un&&x.id!==u.id)){toast('اسم المستخدم مستخدم','err');return false}
    const active=!!d.a,others=DB.list('users').filter(x=>x.id!==u.id&&x.role==='admin'&&x.active!==false).length;
    if(!(d.r==='admin'&&active)&&!others){toast('يجب أن يبقى مدير فعّال واحد على الأقل','err');return false}
    let o=n?await Auth.make(d.n.trim(),un,d.r,d.p):{...u,name:d.n.trim(),username:un,role:d.r,active};
    if(!n){o.active=active;if(d.p){o.salt=uid();o.pass=await Auth.hash(d.p,o.salt)}}
    DB.save('users',o);
    if(Auth.user&&o.id===Auth.user.id)Auth.user={...Auth.user,...o};
    toast('تم الحفظ','ok');
  });
}

Act.sgo=()=>Act.sgoto({dataset:{t:'sprods'}});
Act.sbrowse=Act.sgo;
Act.sup=()=>scrollTo({top:0,behavior:'smooth'});
Act.sgoto=el=>{
  const t=el.dataset.t;
  if(Store.pid||Store.gm){if(t==='top'){Store.pid=null;Store.gm='';location.hash='#/';scrollTo(0,0)}else{Store.after=t;location.hash='#/'}return}
  if(t==='top'){Store.cat='all';Store.brand='all';Store.q='';Store.view='';const i=$('.stq');if(i)i.value='';Store.paint();scrollTo({top:0,behavior:'smooth'});return}
  const target={scats:$('#scatsec'),soffers:$('#soffers'),sresv:$('#sresv'),sreviews:$('#sreviews'),sgames:$('#sgames')}[t]||$('#sprods');
  (target||$('#sprods')).scrollIntoView({behavior:'smooth',block:'start'});
};
Act.sslide=el=>{
  const sl=$('#sslides');if(!sl)return;const n=sl.children.length,w=sl.clientWidth||1;
  if(!el.dataset.auto)Store.pauseUntil=Date.now()+9000;
  let i=Math.round(Math.abs(sl.scrollLeft)/w)||0;
  i=el.dataset.i!==undefined?+el.dataset.i:(i+(+el.dataset.d)+n)%n;
  const dir=getComputedStyle(sl).direction==='rtl'?-1:1,left=dir*i*w;
  if(sl.scrollTo)sl.scrollTo({left,behavior:'smooth'});else sl.scrollLeft=left;
};
Act.smenu=()=>{
  const s=S(),hasR=Store.resv().length>0,m=document.createElement('div');
  m.className='mdl';m.style.cssText='place-items:stretch start;padding:0';
  const it=(a,t,ic,extra='')=>`<button class="smi" data-act="${a}" ${extra}>${I(ic,20)}<span>${t}</span></button>`;
  m.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" style="width:min(320px,86vw);padding:1rem"><div class="row" style="margin-bottom:.8rem"><span class="lgm">${I('book',18)}</span><b class="disp" style="font-size:1.3rem;flex:1">${esc(s.name)}</b><button class="btn ic1 ghost" data-act="close" aria-label="إغلاق">${I('x')}</button></div>
  ${it('sgoto','الرئيسية','home','data-t="top"')}${it('sgoto','التصنيفات','tag','data-t="scats"')}${it('sgoto','العروض','tag','data-t="soffers"')}${hasR?it('sgoto','الحجوزات الإلكترونية','list','data-t="sresv"'):''}${it('sgoto','تقييمات الزبائن','check','data-t="sreviews"')}${it('gohub','ألعاب الذكاء','check')}${it('acct','حسابي','user')}${it('chatopen','الدردشة مع المساعد','wa')}${it('theme','الوضع الداكن / الفاتح','moon')}
  ${s.phone?`<a class="smi" href="${waLink(s.phone,'مرحباً')}" target="_blank" rel="noopener">${I('wa',20)}<span>تواصل عبر واتساب</span></a>`:''}<a class="smi" href="privacy.html">${I('lock',20)}<span>سياسة الخصوصية</span></a><a class="smi" href="#/admin">${I('users',20)}<span>دخول الموظفين</span></a></div>`;
  m.addEventListener('mousedown',e=>{if(e.target===m)closeModal(m)});
  m.addEventListener('click',e=>{if(e.target.closest('.smi'))setTimeout(()=>closeModal(m),0)});
  $('#modals').appendChild(m);
};

/* ---------- التقييمات ---------- */
Act.review=()=>{
  const m=modal({title:'أضف تقييمك',body:`<form id="frv"><div class="stars" id="rst">${[1,2,3,4,5].map(i=>`<button type="button" class="on" data-act="rstar" data-v="${i}" aria-label="${i} نجوم">★</button>`).join('')}</div><input type="hidden" name="rating" value="5">
  <label class="f"><span>الاسم</span><input class="in" name="n" value="${esc(Cust.cur?[Cust.cur.fn,Cust.cur.ln].filter(Boolean).join(' '):'')}" required></label>
  <label class="f"><span>تقييمك</span><textarea class="in" name="t" required maxlength="400" placeholder="كيف كانت تجربتك؟"></textarea></label>
  <div class="row"><label class="btn s">${I('up',15)}أضف صورة (اختياري)<input type="file" accept="image/*" hidden id="rvfile"></label><span id="rvp"></span></div><input type="hidden" name="img"></form>`,foot:`<button class="btn pri" form="frv">إرسال التقييم</button><button class="btn" data-act="close">إلغاء</button>`});
  $('#rvfile',m).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=await resizeImg(f,600);$('[name=img]',m).value=d;$('#rvp',m).innerHTML=`<img src="${d}" style="height:44px;border-radius:8px" alt="">`}catch(x){toast('تعذّر قراءة الصورة','err')}});
  form(m,d=>{
    if(!d.t.trim()){return false}
    DB.save('reviews',{name:d.n.trim(),rating:Math.min(5,Math.max(1,+d.rating||5)),text:d.t.trim(),img:d.img||'',status:'pending',accId:Cust.cur?Cust.cur.id:''});
    toast('شكراً! سيظهر تقييمك بعد المراجعة','ok');
  });
};
Act.rstar=el=>{const v=+el.dataset.v,f=el.closest('form');f.elements.rating.value=v;$$('#rst button',f).forEach((b,i)=>b.classList.toggle('on',i<v))};

/* ---------- الحجوزات (السعر عند الطلب) ---------- */
Act.sresv=el=>{
  const p=DB.get('products',el.dataset.id);if(!p)return;
  $$('.mdl').forEach(closeModal);
  const m=modal({title:'طلب حجز',body:`<form id="frs"><p class="mute" style="margin-bottom:.8rem"><b style="color:var(--ink)">${esc(p.name)}</b><br>السعر عند الطلب — سنتواصل معك لتأكيد السعر وموعد الاستلام.</p>
  <div class="g2"><label class="f"><span>الاسم</span><input class="in" name="n" required value="${esc(Cust.cur?[Cust.cur.fn,Cust.cur.ln].filter(Boolean).join(' '):'')}"></label><label class="f"><span>رقم الهاتف</span><input class="in" name="p" inputmode="tel" required pattern="[0-9٠-٩+ ]{10,15}" value="${esc(Cust.cur?Cust.cur.phone:'')}"></label></div>
  <label class="f"><span>الكمية</span><input class="in" name="q" inputmode="numeric" value="1" required></label><label class="f"><span>ملاحظات (اختياري)</span><input class="in" name="t"></label></form>`,foot:`<button class="btn pri" form="frs">إرسال طلب الحجز</button><button class="btn" data-act="close">إلغاء</button>`});
  form(m,d=>{
    const q=Math.max(1,Math.round(num(d.q))||1);
    const o={id:uid(),no:'R'+String(Date.now()).slice(-6),type:'reservation',ts:Date.now(),name:d.n.trim(),phone:d.p.trim(),addr:'',delivery:'pickup',note:d.t.trim(),accId:Cust.cur?Cust.cur.id:'',items:[{pid:p.id,name:p.name,qty:q,price:p.price||0}],subtotal:0,shipping:0,total:0,status:'new',via:'store'};
    DB.save('orders',o);
    const s=S(),msg=`طلب حجز ${o.no}\n• ${p.name} × ${q}\nالاسم: ${o.name}`;
    setTimeout(()=>modal({title:'وصلنا طلب الحجز ✓',body:`<p>رقم طلبك <b class="disp" style="font-size:1.4rem">${o.no}</b></p><p class="mute">سنتواصل معك على ${esc(o.phone)} لتأكيد السعر والاستلام.</p>`,foot:`${s.phone?`<a class="btn pri" href="${waLink(s.phone,msg)}" target="_blank" rel="noopener">${I('wa',16)}أرسل الطلب على واتساب</a>`:''}<button class="btn" data-act="close">تم</button>`}),60);
  });
};

Act.sinc=el=>{const r=Store.add(el.dataset.id);if(!r.ok)toast(r.msg,'err');Store.paintCart&&Store.paintCart()};
Act.sdec=el=>{const l=Store.cart.find(x=>x.pid===el.dataset.id);if(!l)return;if(--l.qty<=0)Store.cart=Store.cart.filter(x=>x!==l);Store.keep();Store.paint();Store.paintCart&&Store.paintCart()};
Act.srm=el=>{Store.cart=Store.cart.filter(x=>x.pid!==el.dataset.id);Store.keep();Store.paint();Store.paintCart()};
Store.mode='delivery';
Store.fee=function(mode,sub){
  const s=S();
  if(mode!=='delivery')return{n:0};
  if(s.freeShip>0&&sub>=s.freeShip)return{n:0,free:true};
  if(typeof s.shipFee==='number')return{n:s.shipFee};
  return{n:null};
};
Store.paintSum=function(){
  const el=$('#ssum');if(!el)return;
  const s=S(),cur=s.cur,sub=this.total(),f=this.fee(this.mode,sub);let row='',hint='';
  if(this.mode!=='delivery')row=`<div class="tot"><span class="mute">استلام من المكتبة</span><b style="color:var(--ok)">بدون رسوم</b></div>`;
  else if(f.free)row=`<div class="tot"><span class="mute">رسوم التوصيل</span><b style="color:var(--ok)">مجاني</b></div>`;
  else if(f.n===null)row=`<div class="tot"><span class="mute">رسوم التوصيل</span><span class="sm">تُحدَّد عند تأكيد الطلب</span></div>`;
  else row=`<div class="tot"><span class="mute">رسوم التوصيل</span><b>${fmt(f.n)} ${cur}</b></div>`;
  if(this.mode==='delivery'&&s.freeShip>0&&sub<s.freeShip)hint=`<div class="sm mute" style="margin:.2rem 0">أضف مشتريات بـ ${fmt(s.freeShip-sub)} ${cur} للحصول على توصيل مجاني</div>`;
  el.innerHTML=`<div class="tot"><span class="mute">مجموع المنتجات</span><span>${fmt(sub)} ${cur}</span></div>${row}${hint}<div class="tot g" style="margin-top:.4rem"><span class="b">الإجمالي</span><b>${fmt(sub+(f.n||0))} ${cur}</b></div>`;
};
Store.paintCart=function(){
  const el=$('#slines');if(!el)return;
  this.cart=this.cart.filter(l=>DB.get('products',l.pid));
  el.innerHTML=this.cart.length?this.cart.map(l=>{const p=DB.get('products',l.pid);return `<div class="cl" style="grid-template-columns:auto 1fr auto auto"><button class="btn ic1 s ghost" data-act="srm" data-id="${p.id}" aria-label="حذف" style="color:var(--red)">${I('x',16)}</button><div class="cn"><b>${esc(p.name)}</b><small>${fmt(p.price)} ${S().cur}</small></div><div class="qs"><button data-act="sdec" data-id="${p.id}" aria-label="أنقص">−</button><input value="${l.qty}" readonly><button data-act="sinc" data-id="${p.id}" aria-label="زد">+</button></div><div class="ct">${fmt(p.price*l.qty)}</div></div>`}).join(''):empty('🛒','سلتك فارغة','أضف منتجات من المتجر لتبدأ');
  const b=$('#osub');if(b)b.disabled=!this.cart.length;
  this.paintSum();
};

  Store.mode='delivery';
  const m=modal({title:'سلة الطلب',wide:0,body:`<div id="slines"></div><form data-sub="order" id="ordf" style="margin-top:.6rem;padding-top:1rem;border-top:1px solid var(--line)"><b style="display:block;margin-bottom:.6rem">بيانات الاستلام</b>
  <div class="g2"><label class="f"><span>الاسم</span><input class="in" name="n" required autocomplete="name"></label><label class="f"><span>رقم الهاتف</span><input class="in" name="p" inputmode="tel" required pattern="[0-9٠-٩+ ]{10,15}" title="أدخل رقم هاتف صحيحاً" autocomplete="tel"></label></div>
  <div class="seg" style="margin-bottom:.9rem"><button type="button" class="on" data-act="odel" data-m="delivery">توصيل للبيت</button><button type="button" data-act="odel" data-m="pickup">استلام من المكتبة</button></div><input type="hidden" name="m" value="delivery">
  <label class="f" id="addrw"><span>العنوان (المنطقة وأقرب نقطة دالة)</span><input class="in" name="a"></label><label class="f"><span>ملاحظات (اختياري)</span><input class="in" name="t"></label>
  <div id="ssum" style="margin:.4rem 0 .9rem;padding:.7rem .8rem;background:var(--paper);border-radius:10px"></div><button class="btn pri lg" id="osub" style="width:100%">إرسال الطلب</button><p class="sm mute" style="margin-top:.5rem">الدفع عند الاستلام. سنتواصل معك لتأكيد الطلب.</p></form>`});
  Store.m=m;m._close=()=>{Store.m=null;Store.paint()};Store.paintCart();
  if(Cust.cur){const f=$('#ordf').elements;f.n.value=[Cust.cur.fn,Cust.cur.ln].filter(Boolean).join(' ');f.p.value=Cust.cur.phone;f.a.value=Cust.cur.addr||''}
};
Act.odel=el=>{Store.mode=el.dataset.m;const f=el.closest('form');f.elements.m.value=el.dataset.m;$$('.seg button',f).forEach(b=>b.classList.toggle('on',b===el));$('#addrw').style.display=el.dataset.m==='delivery'?'':'none';f.elements.a.required=el.dataset.m==='delivery';Store.paintSum()};
Sub.order=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(!Store.cart.length){toast('السلة فارغة','err');return}
  const items=[];
  for(const l of Store.cart){const p=DB.get('products',l.pid);if(!p||l.qty>(p.stock||0)){toast('الكمية المطلوبة من «'+(p?p.name:'منتج')+'» غير متوفرة','err');return}items.push({pid:p.id,name:p.name,qty:l.qty,price:p.price})}
  const sub=items.reduce((a,i)=>a+i.price*i.qty,0),fee=Store.fee(d.m,sub);
  const o={id:uid(),no:'W'+String(Date.now()).slice(-6),ts:Date.now(),name:d.n.trim(),phone:d.p.trim(),addr:d.m==='delivery'?d.a.trim():'',delivery:d.m,note:d.t.trim(),accId:Cust.cur?Cust.cur.id:'',items,subtotal:sub,shipping:fee.n,total:sub+(fee.n||0),status:'new',via:'store'};
  DB.save('orders',o);Store.cart=[];Store.keep();
  const m=Store.m;Store.m=null;if(m){m._close=null;m.remove()}
  const s=S(),msg=`طلب جديد ${o.no}\n${o.items.map(i=>`• ${i.name} × ${i.qty}`).join('\n')}\n${o.delivery==='delivery'?(o.shipping===null?'رسوم التوصيل: تُحدَّد عند التأكيد':'رسوم التوصيل: '+(o.shipping?fmt(o.shipping)+' '+s.cur:'مجاني')):'استلام من المكتبة'}\nالإجمالي: ${fmt(o.total)} ${s.cur}\nالاسم: ${o.name}\n${o.delivery==='delivery'?'العنوان: '+o.addr:'استلام من المكتبة'}`;
  modal({title:'وصلنا طلبك ✓',body:`<p style="margin-bottom:.6rem">رقم طلبك <b class="disp" style="font-size:1.4rem">${o.no}</b></p><p class="mute">الإجمالي ${fmt(o.total)} ${esc(s.cur)}${o.delivery==='delivery'?(o.shipping===null?' + رسوم التوصيل (تُحدَّد عند التأكيد)':o.shipping?' (يشمل التوصيل '+fmt(o.shipping)+')':' (توصيل مجاني)'):''} — سنتواصل معك على ${esc(o.phone)} لتأكيد الطلب.</p>`,foot:`${s.phone?`<a class="btn pri" href="${waLink(s.phone,msg)}" target="_blank" rel="noopener">${I('wa',16)}أرسل تفاصيل الطلب على واتساب</a>`:''}<button class="btn" data-act="close">تم</button>`});
  Store.paint();
};

/* ---------- الدردشة مع المساعد (مساعد آلي مدرَّب على بيانات المتجر) ---------- */
const STOP=new Set(['هل','يوجد','عندكم','عندك','اريد','ابي','ابغي','ابغى','شنو','شلون','كم','بكم','شكد','سعر','اسعار','من','في','على','عن','لو','سمحت','وين','احتاج','اكو','ماكو','لدي','لديكم','متوفر','متوفره','يا','او','و','ال','لي','لك','ممكن','رجاء','اذا','هواي','هواية','شي','حبيبي','استاذ','اخي','عزيزي','لطفا']);
const CORE=['notes','pens','art','geo','bags','office'];
const OPENERS=['بكل سرور','تفضّل','بالتأكيد','حاضر'];
const Chat={
  open:false,msgs:[],typing:false,teased:false,ctx:{hits:[],cat:null},chips:null,n:0,
  DEF:['ابحث عن منتج','مستلزمات مدرسية','العروض','رسوم التوصيل','ألعاب الذكاء','تواصل مع موظف'],
  norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[؟،؛٪٫٬]/g,' ').replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()},
  nm(){return Cust.cur?String(Cust.cur.fn||'').trim():''},
  greet(){const h=new Date().getHours();return (h<5?'أهلاً':h<12?'صباح الخير':'مساء الخير')+(this.nm()?` ${esc(this.nm())}`:'')},
  op(){return OPENERS[this.n++%OPENERS.length]},
  mount(){
    const w=$('#chatw');if(!w)return;const s=S();w.classList.toggle('chopen',this.open);
    w.innerHTML=`<div class="chfab" id="chfab"><div class="chtease ${this.open||this.teased?'':'wait'}" id="chtease">مرحباً 👋 أنا مساعدك، اسألني!</div><button class="chbtn" data-act="chatopen" aria-label="فتح الدردشة">${ROBOT('rbt-fab')}<span class="chlab">${I('wa',18)}دردشة</span></button></div>
    <section class="chat ${this.open?'open':''}" id="chat" aria-label="الدردشة"><header class="chh"><span class="cha">${ROBOT('rbt-sm')}</span><div style="flex:1;min-width:0"><b>مساعد ${esc(s.name)}</b><small><i class="on"></i>مساعد آلي • متصل الآن</small></div><button class="btn ic1 ghost" data-act="chatclose" aria-label="إغلاق" style="color:#fff">${I('x')}</button></header>
    <div class="chlog" id="chlog" aria-live="polite"></div><div class="chq" id="chq"></div>
    <form class="chf" data-sub="chat"><input class="in" name="m" autocomplete="off" placeholder="اكتب سؤالك أو اسم المنتج…" aria-label="رسالتك"><button class="btn pri ic1" aria-label="إرسال">${I('left',18)}</button></form></section>`;
    if(!this.msgs.length)this.msgs.push({from:'bot',html:`${this.greet()}! أنا المساعد الآلي لـ<b>${esc(s.name)}</b>، ويسعدني خدمتك.<br>يمكنني مساعدتك في البحث عن المنتجات والأسعار والعروض والتوصيل وتجهيز مستلزمات المدرسة. كيف أقدر أخدمك؟`});
    this.paintQ();this.paint();
    if(!this.teased&&!this.open){setTimeout(()=>{this.teased=true;const t=$('#chtease');if(t){t.classList.remove('wait');setTimeout(()=>t&&t.classList.add('wait'),6000)}},3500)}
  },
  paintQ(){const q=$('#chq');if(q)q.innerHTML=(this.chips||this.DEF).map(t=>`<button class="chip" data-act="chq" data-q="${esc(t)}">${esc(t)}</button>`).join('')},
  paint(){const el=$('#chlog');if(!el)return;el.innerHTML=this.msgs.map(m=>`<div class="chm ${m.from}">${m.html}</div>`).join('')+(this.typing?'<div class="chm bot"><span class="dots"><i></i><i></i><i></i></span></div>':'');el.scrollTop=el.scrollHeight},
  add(from,html){this.msgs.push({from,html});this.paint()},
  async ask(text){
    this.add('me',esc(text));this.typing=true;this.paint();
    let r;try{r=await this.reply(text)}catch(e){console.error(e);r={h:'عذراً، حدث خطأ بسيط. يمكنك إعادة المحاولة أو التواصل مع أحد موظفينا مباشرة.'+this.wa()}}
    if(typeof r==='string')r={h:r};
    await new Promise(ok=>setTimeout(ok,320));this.typing=false;this.chips=r.ch||null;this.paintQ();this.add('bot',r.h);
  },
  wa(text){const s=S();return s.phone?`<br><a class="btn s" style="margin-top:.4rem" href="${waLink(s.phone,text||'مرحباً')}" target="_blank" rel="noopener">${I('wa',15)}تواصل مع موظف عبر واتساب</a>`:''},
  list(hits){return `<div class="chps">${hits.map(p=>{const off=p.oldPrice>p.price?` <span class="bd red">-${Math.round((1-p.price/p.oldPrice)*100)}%</span>`:'',st=p.stock||0;return `<div class="chp"><div><b class="lnk" data-act="spd" data-id="${p.id}">${esc(p.name)}</b><small>${p.onRequest?'السعر عند الطلب':fmt(p.price)+' '+S().cur}${off}${!p.onRequest&&st>0&&st<=5?` • باقي ${st}`:''}</small></div>${p.onRequest?`<button class="btn s" data-act="sresv" data-id="${p.id}">حجز</button>`:st>0?`<button class="btn s pri" data-act="sinc" data-id="${p.id}">أضف</button>`:'<span class="bd mute">غير متوفر</span>'}</div>`}).join('')}</div>`},
  find(n){
    const strip=w=>w.startsWith('ال')&&w.length>4?w.slice(2):w,toks=n.split(' ').filter(w=>w.length>1&&!STOP.has(w)),T=toks.map(strip);
    if(!T.length)return{hits:[],toks,cat:null};
    const all=[...Store.items(),...Store.resv()];
    const scored=all.map(p=>{const hay=this.norm(p.name+' '+(p.brand||'')+' '+catOf(p.cat).n);let sc=0;T.forEach(w=>{if(hay.includes(w))sc+=w.length>2?2:1});return{p,sc}}).filter(x=>x.sc>0);
    const cat=S().cats.find(c=>{const cn=this.norm(c.n);return T.some(w=>w.length>=3&&cn.includes(w))});
    const inCat=cat?all.filter(p=>p.cat===cat.id):[];
    const nameHits=scored.filter(x=>x.sc>=2*T.length||x.sc>=2).sort((a,b)=>b.sc-a.sc||((b.p.stock||0)>0)-((a.p.stock||0)>0)).map(x=>x.p);
    if(cat&&T.every(w=>this.norm(cat.n).includes(w)))return{hits:inCat.sort((a,b)=>((b.stock||0)>0)-((a.stock||0)>0)||(b.createdAt||0)-(a.createdAt||0)),toks,cat};
    return{hits:scored.sort((a,b)=>b.sc-a.sc||((b.p.stock||0)>0)-((a.p.stock||0)>0)).map(x=>x.p),toks,cat:null,exact:nameHits.length>0};
  },
  bundle(){const picks=[];CORE.forEach(cid=>{const p=Store.items().filter(x=>x.cat===cid&&(x.stock||0)>0).sort((a,b)=>a.price-b.price)[0];if(p)picks.push(p)});return picks},
  async reply(t){
    const n=this.norm(t),s=S(),cur=s.cur,c=this.ctx;
    const H=(...w)=>w.some(x=>n.includes(this.norm(x))),EQ=re=>re.test(n),ph=s.phone?` ${esc(s.phone)}`:'';
    /* ---- أوامر مرتبطة بالسياق ---- */
    if(EQ(/^(اضف|اضيف|ضيف|خذ|اشتري|نعم اضف)(ه|ها)?( (للسله|الي السله|لسلتي))?$/)||n==='نعم'&&c.hits.length){
      if(!c.hits.length)return{h:'بكل سرور، أي منتج تريد إضافته للسلة؟ اكتب اسمه وسأبحث لك عنه.'};
      const p=c.hits[0],r=Store.add(p.id);
      if(!r.ok)return{h:`${esc(r.msg)}. هل تودّ أن أقترح لك بديلاً مشابهاً؟`,ch:['بديل','الأرخص','السلة']};
      return{h:`تمت إضافة <b>${esc(p.name)}</b> إلى سلتك ✅<br>هل تريد إتمام الطلب أم نكمل التسوّق؟`,ch:['السلة','مستلزمات مدرسية','العروض']};
    }
    if(c.hits.length&&H('الارخص','ارخص','اقل سعر','اوفر')){const l=[...c.hits].filter(p=>!p.onRequest).sort((a,b)=>a.price-b.price).slice(0,3);if(l.length)return{h:`أقل الأسعار بين النتائج:${this.list(l)}`,ch:['اضفه للسلة','بديل','السلة']}}
    if(c.hits.length&&H('الاغلى','اغلى','افضل نوع','الافضل')){const l=[...c.hits].filter(p=>!p.onRequest).sort((a,b)=>b.price-a.price).slice(0,3);if(l.length)return{h:`الأعلى سعراً (عادةً الأعلى جودة):${this.list(l)}`,ch:['اضفه للسلة','الأرخص','السلة']}}
    if(c.cat&&EQ(/^(بديل|غيره|ثاني|خيارات اخري|شي اخر|غير هذا|المزيد|زياده)$/)){
      const seen=new Set(c.hits.map(p=>p.id)),l=Store.items().filter(p=>p.cat===c.cat&&!seen.has(p.id)&&(p.stock||0)>0).slice(0,4);
      if(l.length){c.hits=l;return{h:`هذه خيارات أخرى من القسم نفسه:${this.list(l)}`,ch:['اضفه للسلة','الأرخص','السلة']}}
    }
    /* ---- مساعدة وتحيات ---- */
    if(H('ماذا تستطيع','شنو تسوي','خدماتك','مساعده','help','شنو تقدر','ايش تقدر'))return{h:`${this.op()}، يمكنني مساعدتك في:<ul class="chul"><li>البحث عن أي منتج ومعرفة سعره وتوفره</li><li>عرض العروض والمنتجات الجديدة</li><li>تجهيز قائمة مستلزمات مدرسية جاهزة</li><li>رسوم التوصيل وطرق الدفع وساعات الدوام</li><li>متابعة حالة طلبك وسلتك</li><li>ألعاب الذكاء للطلاب 🧠</li></ul>`};
    if(H('لعبه','العاب','العب','اسئله','تحدي','مسابقه','لغز','الغاز','ذكاء','تسليه','اختبار معلومات'))return{h:`لدينا قسم <b>ألعاب الذكاء 🧠</b> للطلاب والتلاميذ: اختبار معلومات، لعبة ذاكرة، تحدّي حساب سريع، وترتيب حروف. اختر ما يناسبك:<div class="chps">${Object.entries(GAMES).map(([k,g])=>`<button class="btn s" data-act="gplay" data-g="${k}">${g.i} ${g.t}</button>`).join('')}</div>`,ch:['مستلزمات مدرسية','العروض','رسوم التوصيل']};
    if(EQ(/^(مرحبا|اهلا|هلا|السلام عليكم|سلام عليكم|سلام|هاي|هلو|صباح الخير|مساء الخير|هلا والله|الله يعطيك العافيه)( .*)?$/)&&n.split(' ').length<=4)return{h:`${this.greet()}! أهلاً بك في <b>${esc(s.name)}</b>. كيف يمكنني مساعدتك؟`};
    if(H('شكرا','مشكور','تسلم','يعطيك العافيه','ممتاز','كفو'))return{h:'العفو، هذا واجبنا 🌟 هل هناك ما يمكنني مساعدتك به أيضاً؟',ch:this.DEF};
    if(EQ(/^(مع السلامه|باي|الى اللقاء|سلام|تمام شكرا|لا شكرا)$/))return{h:'شكراً لتواصلك، نتشرف بخدمتك دائماً. أسعد الله يومك 🌷'};
    /* ---- سياسات وخدمات ---- */
    if(H('موظف','شخص حقيقي','اتصل','كلمني','ادارة','المدير','خدمه العملاء','اكلم احد','احد يرد'))return{h:`بالتأكيد. يمكنك التواصل مع أحد موظفينا مباشرة${ph?` على الرقم:<b>${ph}</b>`:''}.${this.wa('مرحباً، أحتاج إلى مساعدة من أحد الموظفين')}`};
    if(H('ارجاع','استرجاع','استبدال','ترجيع','ارجع','استبدل'))return{h:`${this.op()}. ${s.policy?esc(s.policy):'يمكن الإرجاع أو الاستبدال بوجود الفاتورة وحالة المنتج سليمة، وفق سياسة المكتبة.'}<br>للتنسيق أرسل رقم الفاتورة أو الطلب للموظف المختص.${this.wa('أريد إرجاع/استبدال منتج')}`,ch:['حالة طلبي','تواصل مع موظف']};
    if(H('شكوي','شكوى','مشكله','تاخر','تأخر','تالف','ناقص','خطا','غلط','سيء','زعلان','مو راضي'))return{h:`نعتذر منك عن أي إزعاج، وحقك علينا. لأجل معالجة الموضوع بأسرع وقت، أرسل رقم الطلب أو الفاتورة وتفاصيل المشكلة لأحد موظفينا:${this.wa('لدي ملاحظة/مشكلة بخصوص طلبي')}`,ch:['حالة طلبي','تواصل مع موظف']};
    if(H('حاله طلب','طلبي','طلباتي','تتبع','وين طلب','رقم الطلب')){
      if(!Cust.cur)return{h:`لأعرض لك حالة طلباتك يرجى تسجيل الدخول من «حسابي».<br><button class="btn s pri" style="margin-top:.4rem" data-act="acct">تسجيل الدخول</button>${this.wa('أريد الاستفسار عن حالة طلبي')}`};
      const l=(await DB.query('orders','accId',Cust.cur.id)).sort((a,b)=>b.ts-a.ts).slice(0,3);
      return l.length?{h:`آخر طلباتك:<br>${l.map(o=>`<b>${esc(o.no)}</b> — ${OST[o.status]?OST[o.status][0]:esc(o.status)} <small class="mute">(${dt(o.ts)})</small>`).join('<br>')}`,ch:['تواصل مع موظف',...this.DEF.slice(0,2)]}:{h:'لا توجد طلبات على حسابك حتى الآن. يسعدنا تجهيز أول طلب لك! 😊',ch:this.DEF};
    }
    if(H('سلتي','السله','سله الطلب','اطلب الان','اتمام الطلب','اكمل الطلب','ادفع')){
      if(!Store.cart.length)return{h:'سلتك فارغة حالياً. ابحث عن منتج أو جرّب قائمة المستلزمات المدرسية الجاهزة.',ch:['مستلزمات مدرسية','العروض','ابحث عن منتج']};
      const lines=Store.cart.map(l=>{const p=DB.get('products',l.pid);return p?`• ${esc(p.name)} × ${l.qty} — ${fmt(p.price*l.qty)}`:''}).filter(Boolean).join('<br>'),tot=Store.total(),f=Store.fee('delivery',tot);
      return{h:`ملخص سلتك:<br>${lines}<br><b>مجموع المنتجات: ${fmt(tot)} ${cur}</b><br><small class="mute">${f.free?'التوصيل مجاني لهذا الطلب.':f.n===null?'رسوم التوصيل تُحدَّد عند التأكيد.':`رسوم التوصيل ${fmt(f.n)} ${cur} (لا تُحتسب عند الاستلام من المكتبة).`}</small><br><button class="btn s pri" style="margin-top:.4rem" data-act="scart">إتمام الطلب</button>`,ch:['العروض','رسوم التوصيل','مستلزمات مدرسية']};
    }
    if(H('توصيل','شحن','توصلون','دليفري','اجور','رسوم','مناطق التوصيل')){
      const f=typeof s.shipFee==='number'?`رسوم التوصيل <b>${fmt(s.shipFee)} ${cur}</b>`:'رسوم التوصيل تُحدَّد عند تأكيد الطلب حسب منطقتك';
      return{h:`${f}${s.freeShip>0?`، والتوصيل <b>مجاني</b> للطلبات فوق ${fmt(s.freeShip)} ${cur}`:''}.<br>كما يمكنك الاستلام من المكتبة دون أي رسوم، والدفع عند الاستلام نقداً.`,ch:['كيف أطلب؟','ساعات الدوام','السلة']};
    }
    if(H('دوام','ساعات','تفتحون','تسكرون','مفتوح','وقت العمل','مواعيد','متى تفتح'))return{h:s.hours?`ساعات الدوام: <b>${esc(s.hours)}</b>.`:`لم يتم تحديد ساعات الدوام هنا، يسعدنا تأكيدها لك:${this.wa('ما هي ساعات دوامكم؟')}`,ch:['العنوان','رسوم التوصيل']};
    if(H('عنوان','موقع','وينكم','اين','فرع','هاتف','واتساب','واتس','تواصل','اتصال','رقمكم'))return{h:`${s.address?`📍 ${esc(s.address)}<br>`:''}${ph?`📞${ph}`:''}${this.wa()}`,ch:['ساعات الدوام','رسوم التوصيل']};
    if(H('دفع','كاش','تدفعون','بطاقه','طرق الدفع'))return{h:'الدفع <b>عند الاستلام نقداً</b> سواء للتوصيل أو للاستلام من المكتبة.',ch:['رسوم التوصيل','كيف أطلب؟']};
    if(H('كيف اطلب','طريقه الطلب','كيف اشتري','خطوات','كيف احجز الطلب','شلون اطلب'))return{h:`خطوات الطلب:<ol class="chul"><li>أضف المنتجات إلى السلة.</li><li>افتح السلة واختر «توصيل» أو «استلام من المكتبة».</li><li>أدخل اسمك ورقم هاتفك (وعنوانك للتوصيل).</li><li>أرسل الطلب، وسنتواصل معك لتأكيده.</li></ol>`,ch:['السلة','رسوم التوصيل']};
    if(H('حجز','احجز','ملزمه','ملازم')){
      const rs=Store.resv();
      return rs.length?{h:`الحجز المسبق متاح للمنتجات التالية (السعر عند الطلب)، أرسل طلب حجز وسنتواصل معك لتأكيد السعر والاستلام:${this.list(rs.slice(0,4))}`,ch:['العروض','ساعات الدوام']}:{h:`لا توجد منتجات حجز متاحة حالياً. يمكنك التواصل معنا لطلب ملزمة محددة:${this.wa('أريد حجز ملزمة')}`};
    }
    if(H('حسابي','تسجيل','انشاء حساب','نسيت كلمه','كلمه المرور','كلمه السر'))return{h:`لإنشاء حساب أو الدخول اضغط «حسابي» في أعلى المتجر. وإذا نسيت كلمة المرور فيمكن لموظفينا تعيين كلمة جديدة لك بعد التأكد من رقم هاتفك:${this.wa('نسيت كلمة المرور لحسابي')}`,ch:['تواصل مع موظف']};
    /* ---- عروض وجديد وقوائم ---- */
    if(H('عروض','عرض','تخفيض','تخفيضات','خصم','خصومات','رخيص','اوفر')){
      const off=Store.items().filter(p=>p.oldPrice>p.price).sort((a,b)=>(b.oldPrice-b.price)/b.oldPrice-(a.oldPrice-a.price)/a.oldPrice).slice(0,4);
      if(!off.length)return{h:'لا توجد عروض مخفّضة حالياً، لكن أضفنا منتجات جديدة قد تعجبك.',ch:['وصل حديثاً','مستلزمات مدرسية']};
      c.hits=off;c.cat=null;return{h:`${this.op()}، هذه أبرز العروض الحالية:${this.list(off)}<button class="btn s" data-act="chview" data-v="offers">عرض كل العروض</button>`,ch:['اضفه للسلة','الأرخص','السلة']};
    }
    if(H('جديد','وصل حديثا','احدث','جديدكم','اخر الاضافات')){
      const nw=[...Store.items()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,4);
      if(!nw.length)return{h:'المتجر قيد التجهيز حالياً، تابعنا قريباً.'};
      c.hits=nw;c.cat=null;return{h:`وصل حديثاً إلى المتجر:${this.list(nw)}<button class="btn s" data-act="chview" data-v="new">عرض كل الجديد</button>`,ch:['اضفه للسلة','العروض','السلة']};
    }
