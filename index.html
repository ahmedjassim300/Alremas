  start(){
    const cat=G.st.cat||'منوّع',pool=shuffle(this.bank(cat)).slice(0,10);
    if(!pool.length){toast('لا توجد أسئلة في هذا النوع','err');return}
    G.st={stage:'play',cat,list:pool.map(x=>this.prep(x)),i:0,score:0,pts:0,streak:0,max:0,ans:null,left:20};
    this.arm();G.paint();
  },
  arm(){G.stop();G.every(()=>this.tick(),1000)},
  tick(){
    const s=G.st;if(s.stage!=='play'||s.ans!==null)return;
    s.left--;const b=$('#qtm i'),t=$('#qtl');if(b)b.style.width=Math.max(s.left,0)/20*100+'%';if(t)t.textContent=Math.max(s.left,0);
    if(s.left<=0)this.pick(-1);
  },
  pick(i){
    const s=G.st;if(s.stage!=='play'||s.ans!==null)return;const q=s.list[s.i];s.ans=i;
    if(i===q.a){s.score++;s.streak++;s.max=Math.max(s.max,s.streak);s.pts+=10+Math.ceil(Math.max(s.left,0)/4)}else s.streak=0;
    G.paint();G.later(()=>this.next(),1500);
  },
  next(){
    const s=G.st;if(s.stage!=='play'||s.ans===null)return;
    if(s.i+1>=s.list.length){G.stop();s.stage='end';s.newBest=G.keep('quiz',s.pts,(a,b)=>a>b);G.paint();return}
    s.i++;s.ans=null;s.left=20;this.arm();G.paint();
  },
  play(){
    const s=G.st,q=s.list[s.i];
    return `<div class="gq"><div class="gtop"><span>سؤال <b>${s.i+1}</b>/${s.list.length}</span><span>⭐ ${s.pts}</span><span>🔥 ${s.streak}</span><span id="qtimer">⏱ <b id="qtl">${Math.max(s.left,0)}</b></span></div>
    <div class="gbar" id="qtm"><i style="width:${Math.max(s.left,0)/20*100}%"></i></div><h3 class="gqt">${esc(q.q)}</h3>
    <div class="gopts">${q.o.map((o,i)=>`<button class="gopt ${s.ans===null?'':i===q.a?'ok':i===s.ans?'bad':'dim'}" data-act="qpick" data-i="${i}" ${s.ans===null?'':'disabled'}>${esc(o)}</button>`).join('')}</div>
    ${s.ans!==null?`<div class="gfb ${s.ans===q.a?'ok':'bad'}">${s.ans===q.a?'إجابة صحيحة! 🎉':s.ans===-1?'انتهى الوقت ⏰':'إجابة خاطئة'} <button class="btn s" data-act="qnext">التالي ‹</button></div>`:''}</div>`;
  },
  end(){
    const s=G.st,n=s.list.length,r=s.score/n,msg=r>=.9?['ممتاز! عبقري صغير 🏆','🏆']:r>=.7?['رائع جداً! 👏','🥇']:r>=.5?['جيد، حاول مرة أخرى وستتفوق 💪','🥈']:['لا بأس، التدريب يصنع الفرق 📚','🌱'];
    return Gend(msg[0],msg[1],[`الإجابات الصحيحة: <b>${s.score}</b> من ${n}`,`النقاط: <b>${s.pts}</b>${s.newBest?' — رقم قياسي جديد! 🌟':''}`,`أطول سلسلة صحيحة: <b>${s.max}</b> 🔥`],'qstart');
  }
};

/* ---------- لعبة الذاكرة ---------- */
const Mem={
  menu(){return `<div class="gmenu"><h2>${GAMES.mem.i} ${GAMES.mem.t}</h2><p class="mute">اقلب بطاقتين في كل مرة، وطابق الأدوات المتشابهة بأقل عدد ممكن من المحاولات.</p><div class="row" style="margin-top:1rem">${[['easy','سهل (6 أزواج)'],['mid','متوسط (8 أزواج)'],['hard','صعب (10 أزواج)']].map(([k,t])=>`<button class="btn pri lg" data-act="mstart" data-l="${k}">${t}</button>`).join('')}</div></div>`},
  start(level){
    const pairs={easy:6,mid:8,hard:10}[level]||8,emo=shuffle(MEMO).slice(0,pairs);
    G.st={stage:'play',level,cards:shuffle([...emo,...emo]).map(e=>({e,open:false,done:false})),first:-1,lock:false,moves:0,t:0};
    this.arm();G.paint();
  },
  arm(){G.stop();G.every(()=>{const s=G.st;if(s.stage!=='play')return;s.t++;const el=$('#mt');if(el)el.textContent=mmss(s.t)},1000)},
  flip(i){
    const s=G.st;if(s.stage!=='play'||s.lock)return;const c=s.cards[i];if(!c||c.open||c.done)return;
    c.open=true;
    if(s.first<0){s.first=i;G.paint();return}
    s.moves++;const a=s.cards[s.first];
    if(a.e===c.e){
      a.done=c.done=true;s.first=-1;
      if(s.cards.every(x=>x.done)){G.stop();s.stage='end';s.stars=s.moves<=s.cards.length/2+2?3:s.moves<=s.cards.length*.8?2:1;s.newBest=G.keep('mem_'+s.level,s.moves,(x,y)=>x<y)}
    }else{s.lock=true;G.later(()=>{a.open=false;c.open=false;s.first=-1;s.lock=false;G.paint()},800)}
    G.paint();
  },
  play(){
    const s=G.st,cols=s.cards.length===12?3:s.cards.length===16?4:5;
    return `<div class="gtop"><span>المحاولات: <b>${s.moves}</b></span><span>⏱ <b id="mt">${mmss(s.t)}</b></span></div><div class="mgrid" style="--cols:${cols}">${s.cards.map((c,i)=>`<button class="mc ${c.open||c.done?'flip':''} ${c.done?'done':''}" data-act="mflip" data-i="${i}" aria-label="بطاقة ${i+1}"><span class="mf">${c.e}</span><span class="mb">؟</span></button>`).join('')}</div>`;
  },
  end(){const s=G.st;return Gend('أحسنت! أكملت اللعبة 🎉','⭐'.repeat(s.stars),[`المحاولات: <b>${s.moves}</b>`,`الزمن: <b>${mmss(s.t)}</b>${s.newBest?' — رقم قياسي جديد! 🌟':''}`],'mrestart')}
};

/* ---------- تحدّي الحساب السريع ---------- */
const MathG={
  menu(){return `<div class="gmenu"><h2>${GAMES.math.i} ${GAMES.math.t}</h2><p class="mute">لديك 60 ثانية. كل إجابة صحيحة تمنحك نقاطاً، وتزيد النقاط مع السلسلة المتتالية.</p><div class="row" style="margin-top:1rem">${[[1,'سهل'],[2,'متوسط'],[3,'صعب']].map(([k,t])=>`<button class="btn pri lg" data-act="hstart" data-l="${k}">${t}</button>`).join('')}</div></div>`},
  gen(level){
    const r=(x,y)=>Math.floor(Math.random()*(y-x+1))+x;let text,ans;
    if(level===1){if(Math.random()<.5){const a=r(1,20),b=r(1,20);text=`${a} + ${b}`;ans=a+b}else{const a=r(5,30),b=r(1,a);text=`${a} − ${b}`;ans=a-b}}
    else if(level===2){const k=r(0,2);if(k===0){const a=r(2,9),b=r(2,9);text=`${a} × ${b}`;ans=a*b}else if(k===1){const a=r(20,99),b=r(10,99);text=`${a} + ${b}`;ans=a+b}else{const a=r(40,99),b=r(10,a);text=`${a} − ${b}`;ans=a-b}}
    else{const k=r(0,3);if(k===0){const a=r(6,12),b=r(6,12);text=`${a} × ${b}`;ans=a*b}else if(k===1){const b=r(2,12),c=r(2,12);text=`${b*c} ÷ ${b}`;ans=c}else if(k===2){const a=r(2,9),b=r(2,9),c=r(1,20);text=`${a} × ${b} + ${c}`;ans=a*b+c}else{const a=r(100,500),b=r(50,300);text=`${a} + ${b}`;ans=a+b}}
    const set=new Set([ans]);let guard=0;while(set.size<4&&guard++<50){const d=r(1,10)*(Math.random()<.5?-1:1),v=ans+d;if(v>=0)set.add(v)}
    return{text,ans,o:shuffle([...set])};
  },
  start(level){G.st={stage:'play',level:+level||1,score:0,ok:0,bad:0,streak:0,left:60,q:this.gen(+level||1)};this.arm();G.paint()},
  arm(){G.stop();G.every(()=>this.tick(),1000)},
  tick(){const s=G.st;if(s.stage!=='play')return;s.left--;const t=$('#htl'),b=$('#htm i');if(t)t.textContent=Math.max(s.left,0);if(b)b.style.width=Math.max(s.left,0)/60*100+'%';if(s.left<=0){G.stop();s.stage='end';s.newBest=G.keep('math',s.score,(a,b)=>a>b);G.paint()}},
  pick(v){
    const s=G.st;if(s.stage!=='play')return;
    if(+v===s.q.ans){s.ok++;s.streak++;s.score+=10+Math.min(s.streak,5)*2}else{s.bad++;s.streak=0}
    s.q=this.gen(s.level);G.paint();
  },
  play(){const s=G.st;return `<div class="gtop"><span>⭐ <b>${s.score}</b></span><span>🔥 ${s.streak}</span><span>⏱ <b id="htl">${Math.max(s.left,0)}</b></span></div><div class="gbar" id="htm"><i style="width:${Math.max(s.left,0)/60*100}%"></i></div><h3 class="gqt gmath">${s.q.text} = ؟</h3><div class="gopts g2c">${s.q.o.map(o=>`<button class="gopt" data-act="hpick" data-v="${o}">${o}</button>`).join('')}</div>`},
  end(){const s=G.st,tot=s.ok+s.bad,acc=tot?Math.round(s.ok/tot*100):0;return Gend('انتهى الوقت! ⏰',s.score>=200?'🏆':s.score>=100?'🥇':'🎯',[`النقاط: <b>${s.score}</b>${s.newBest?' — رقم قياسي جديد! 🌟':''}`,`إجابات صحيحة: <b>${s.ok}</b> • خاطئة: ${s.bad}`,`الدقة: <b>${acc}%</b>`],'hrestart')}
};

/* ---------- رتّب الحروف ---------- */
const Word={
  menu(){return `<div class="gmenu"><h2>${GAMES.word.i} ${GAMES.word.t}</h2><p class="mute">8 كلمات مدرسية بحروف مبعثرة. اضغط الحروف بالترتيب الصحيح لتكوين الكلمة. المساعدة تخصم 3 نقاط.</p><button class="btn pri lg" data-act="wstart" style="margin-top:1rem">ابدأ اللعب</button></div>`},
  start(){G.st={stage:'play',words:shuffle(WORDS).slice(0,8),i:0,score:0,solved:0,hint:false,slots:[],tiles:[],flash:''};this.load();G.paint()},
  load(){
    const s=G.st,w=s.words[s.i],ls=[...w];let sc;let g=0;
    do{sc=shuffle(ls)}while(sc.join('')===w&&g++<20);
    s.tiles=sc.map((ch,k)=>({ch,used:false,id:k}));s.slots=[];s.hint=false;s.flash='';
  },
  tap(k){
    const s=G.st;if(s.stage!=='play'||s.flash)return;const t=s.tiles[k];if(!t||t.used)return;
    t.used=true;s.slots.push(k);const w=s.words[s.i];
    if(s.slots.length===w.length){
      const got=s.slots.map(id=>s.tiles[id].ch).join('');
      if(got===w){s.flash='ok';s.solved++;s.score+=s.hint?7:10;G.paint();G.later(()=>this.nextWord(),1100);return}
      s.flash='bad';G.paint();G.later(()=>{s.slots.forEach(id=>s.tiles[id].used=false);s.slots=[];s.flash='';G.paint()},800);return;
    }
    G.paint();
  },
  back(pos){const s=G.st;if(s.stage!=='play'||s.flash)return;const id=s.slots[pos];if(id===undefined)return;s.slots.splice(pos,1);s.tiles[id].used=false;G.paint()},
  hint(){
    const s=G.st;if(s.stage!=='play'||s.flash)return;const w=s.words[s.i];
    s.slots.forEach(id=>s.tiles[id].used=false);s.slots=[];
    const k=s.tiles.findIndex(t=>t.ch===w[0]&&!t.used);if(k>=0){s.tiles[k].used=true;s.slots.push(k)}
    s.hint=true;G.paint();
  },
  skip(){const s=G.st;if(s.stage!=='play'||s.flash)return;this.nextWord()},
  nextWord(){const s=G.st;if(s.stage!=='play')return;if(s.i+1>=s.words.length){s.stage='end';s.newBest=G.keep('word',s.score,(a,b)=>a>b);G.paint();return}s.i++;this.load();G.paint()},
  play(){
    const s=G.st,w=s.words[s.i];
    return `<div class="gtop"><span>كلمة <b>${s.i+1}</b>/${s.words.length}</span><span>⭐ ${s.score}</span></div><p class="mute" style="text-align:center;margin:.6rem 0">رتّب الحروف لتكوين الكلمة</p>
    <div class="wslots ${s.flash}">${[...w].map((_,p)=>{const id=s.slots[p];return id===undefined?`<span class="wt empty">·</span>`:`<button class="wt ${s.flash==='ok'?'ok':''}" data-act="wback" data-p="${p}">${s.tiles[id].ch}</button>`}).join('')}</div>
    <div class="wtiles">${s.tiles.map((t,k)=>`<button class="wt pool ${t.used?'used':''}" data-act="wtap" data-k="${k}" ${t.used?'disabled':''}>${t.ch}</button>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn" data-act="whint">💡 مساعدة (−3)</button><button class="btn" data-act="wskip">تخطَّ ‹</button></div>${s.flash==='ok'?'<div class="gfb ok">أحسنت! 🎉</div>':s.flash==='bad'?'<div class="gfb bad">حاول مرة أخرى</div>':''}`;
  },
  end(){const s=G.st;return Gend('أنهيت الجولة! 🎉',s.solved>=6?'🏆':'🌟',[`الكلمات الصحيحة: <b>${s.solved}</b> من ${s.words.length}`,`النقاط: <b>${s.score}</b>${s.newBest?' — رقم قياسي جديد! 🌟':''}`],'wstart')}
};

  $$('.mdl').forEach(closeModal);let l=[];
  try{l=(await DB.query('orders','accId',Cust.cur.id)).sort((a,b)=>b.ts-a.ts)}catch(e){toast('تعذّر تحميل الطلبات','err');return}
  modal({title:'طلباتي',body:l.length?`<div class="list">${l.map(o=>`<div class="li" style="align-items:flex-start"><div style="flex:1"><b class="disp">${esc(o.no)}</b> <span class="bd ${OST[o.status]?OST[o.status][1]:'mute'}">${OST[o.status]?OST[o.status][0]:''}</span><div class="sm mute">${dt(o.ts)} • ${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('، ')}</div></div><b>${fmt(o.total)}</b></div>`).join('')}</div>`:empty('🛍️','لا طلبات بعد','ستظهر طلباتك هنا بعد أول طلب')});
};

Act.accdelme=()=>{
  $$('.mdl').forEach(closeModal);
  const m=modal({title:'حذف الحساب',body:`<form id="fdm"><p class="mute" style="margin-bottom:.8rem">سيُحذف حسابك (الاسم والهاتف والعنوان وكلمة المرور) نهائياً ولا يمكن التراجع. تبقى طلباتك السابقة في سجلات المكتبة دون ربطها بحسابك.</p><label class="f"><span>أدخل كلمة المرور للتأكيد</span><input class="in" name="pw" type="password" required autocomplete="current-password"></label></form>`,foot:`<button class="btn red" form="fdm">حذف حسابي نهائياً</button><button class="btn" data-act="close">إلغاء</button>`});
  form(m,async d=>{
    let a=null;try{a=await DB.fetch('accounts',Cust.cur.id)}catch(e){toast('تعذّر الاتصال، حاول لاحقاً','err');return false}
    if(!a||!(await Auth.verify(d.pw,a))){toast('كلمة المرور غير صحيحة','err');return false}
    try{const os=await DB.query('orders','accId',a.id);if(os.length)DB.batch(os.map(o=>({t:'set',col:'orders',doc:{...o,accId:''}})))}catch(e){}
    DB.remove('accounts',a.id);Cust.out();toast('تم حذف حسابك','ok');Store.render();
  });
};

</script>
</body>
</html>
