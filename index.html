<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1F4D">
<title>مكتبة الريماس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F7FC;--card:#fff;--ink:#0F1F4D;--ink2:#41507A;--mute:#7481A3;--line:#DCE4F1;--rule:#EAF0F9;--pri:#1B3FA0;--pri2:#2A52C4;--priS:#E7EDFC;--onpri:#fff;--red:#D6344B;--redS:#FCE8EB;--hl:#FFE45C;--hlS:#FFF6C7;--ok:#1B8A5E;--okS:#DFF4EA;--warn:#B77400;--warnS:#FFF0D2;--side:#0F1F4D;--sideT:#BFCBEE;--sheet:#fff;--u:40px}
[data-theme=dark]{--paper:#0B1120;--card:#131B30;--ink:#E9EEFC;--ink2:#AAB6D8;--mute:#7885AB;--line:#25304E;--rule:#1B2440;--pri:#7C99FF;--pri2:#95AEFF;--priS:#1C2857;--onpri:#0B1230;--red:#FF6B80;--redS:#3A1822;--hl:#FFE45C;--hlS:#3A3410;--ok:#4FD3A0;--okS:#12332A;--warn:#F2B740;--warnS:#3A2E0E;--side:#080D1A;--sideT:#9FACD3;--sheet:#131B30}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip;max-width:100%}
body{overflow-x:clip;max-width:100%;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,h4,.brand,.disp{font-family:'Lalezar','IBM Plex Sans Arabic',Tahoma,sans-serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ic{flex:none}
.sp{flex:1}
.hide{display:none!important}
.mute{color:var(--mute)}.sm{font-size:.85rem}.b{font-weight:600}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.col1{display:flex;flex-direction:column;gap:.6rem}
/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:500;min-height:40px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.pri:hover{background:var(--pri2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.hl{background:var(--hl);border-color:var(--hl);color:#0F1F4D}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--priS)}
.btn.s{min-height:32px;padding:.2rem .65rem;font-size:.85rem}
.btn.ic1{padding:.4rem;min-width:36px}
.btn.lg{min-height:54px;font-size:1.15rem;padding:.7rem 1.4rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:.5rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:40px}
.in:focus{border-color:var(--pri);outline:2px solid var(--priS)}
textarea.in{min-height:80px;resize:vertical}
label.f{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:.85rem}
label.f>span{display:block;margin-bottom:.25rem;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .9rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;padding:.5rem .4rem;font-weight:500;font-size:.9rem;border-inline-start:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:.35rem}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--pri);color:var(--onpri)}
.chip{padding:.28rem .8rem;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.85rem;white-space:nowrap;display:inline-flex;gap:.35rem;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:thin}
.bd{display:inline-block;padding:.05rem .55rem;border-radius:6px;font-size:.78rem;font-weight:600;white-space:nowrap}
.bd.ok{background:var(--okS);color:var(--ok)}.bd.warn{background:var(--warnS);color:var(--warn)}.bd.red{background:var(--redS);color:var(--red)}.bd.pri{background:var(--priS);color:var(--pri)}.bd.mute{background:var(--rule);color:var(--ink2)}
/* app shell */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.side{background:var(--side);color:var(--sideT);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:1rem .7rem;z-index:60}
.side .brand{display:flex;align-items:center;gap:.6rem;font-size:1.45rem;color:#fff;padding:.2rem .6rem 1.1rem}
.side .brand .lg1{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--red);display:grid;place-items:center;border-inline-start:6px double var(--red)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:8px;color:var(--sideT);position:relative;font-weight:500}
.nav a:hover{color:#fff}
.nav a>*{position:relative;z-index:1}
.nav a.on{color:#0F1F4D}
.nav a.on::before{content:'';position:absolute;inset:3px 0;background:var(--hl);border-radius:5px 12px 6px 14px;transform:rotate(-.7deg)}
.nav .nb{margin-inline-start:auto;background:var(--red);color:#fff;font-size:.72rem;border-radius:99px;padding:0 .45rem;min-width:20px;text-align:center}
.sidef{border-top:1px solid rgba(255,255,255,.12);padding-top:.7rem;font-size:.82rem;display:flex;flex-direction:column;gap:.3rem}
.sidef a{display:flex;gap:.5rem;align-items:center;padding:.3rem .6rem;color:var(--sideT)}
.top{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.4rem;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:40}
.top h2{font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mainw{min-width:0}
.menu{display:none}
.main{padding:1.2rem 1.4rem 5rem;max-width:1500px;margin:0 auto}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .8rem;border-radius:99px;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--card)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px var(--okS)}
.pill.off i{background:var(--red)}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.ph1 h1{font-size:1.9rem;line-height:1.2}
/* cards, tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.card h3{font-size:1.15rem;margin-bottom:.6rem}
.cgrid{display:grid;gap:1rem}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.9rem;margin-bottom:1rem}
.kpi{padding:.9rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.kpi small{color:var(--mute);display:block}
.kpi b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.7rem;line-height:1.3;display:block}
.kpi.big{background:var(--side);border-color:var(--side);color:#fff;border-radius:16px 16px 4px 16px}
.kpi.big small{color:var(--sideT)}.kpi.big b{color:var(--hl);font-size:2.1rem}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;font-size:.8rem;color:var(--mute);text-align:start;padding:.6rem .85rem;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem .85rem;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--priS)}
td.e,th.e{text-align:end}
.tool{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem;align-items:center}
.tool .in{width:auto;min-width:200px;flex:1}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--mute)}
.empty .em{font-size:2.4rem;display:block;margin-bottom:.4rem}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.li:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--priS);color:var(--pri);display:grid;place-items:center;font-weight:600;flex:none}
/* modal + toast */
.mdl{position:fixed;inset:0;background:rgba(8,14,38,.55);display:grid;place-items:center;z-index:100;padding:1rem;overflow:auto}
.mbox{background:var(--card);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 2rem);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
.mbox.wide{width:min(880px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.1rem;border-bottom:1px solid var(--line)}
.mh h3{font-size:1.3rem}
.mb{padding:1.1rem;overflow:auto}
.mf{padding:.75rem 1.1rem;border-top:1px solid var(--line);display:flex;gap:.6rem;background:var(--paper);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#toasts{position:fixed;bottom:1rem;inset-inline:0;display:grid;justify-items:center;gap:.5rem;z-index:300;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:10px;font-weight:500;animation:pop .2s}
.toast.err{background:var(--red);color:#fff}.toast.ok{background:var(--ok);color:#fff}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--paper)}
.sheet{position:relative;background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0 calc(var(--u) - 1px),var(--line) calc(var(--u) - 1px) var(--u));border:1px solid var(--line);border-radius:6px 20px 20px 6px}
.sheet::before{content:'';position:absolute;inset-block:0;inset-inline-start:74px;width:5px;border-inline:1.5px solid var(--red);opacity:.65}
.sheet::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at calc(100% - 26px) 14%,var(--paper) 0 10px,#0000 11px),radial-gradient(circle at calc(100% - 26px) 50%,var(--paper) 0 10px,#0000 11px),radial-gradient(circle at calc(100% - 26px) 86%,var(--paper) 0 10px,#0000 11px)}
.authc{width:min(440px,100%);padding:2rem 2rem 1.6rem 3.4rem;padding-inline-start:104px;padding-inline-end:52px}
.authc h1{font-size:2.3rem;color:var(--pri);line-height:1.2;margin-bottom:.3rem}
.authc .in{background:rgba(255,255,255,.85)}[data-theme=dark] .authc .in{background:var(--card)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:1rem;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.7rem;margin-top:.7rem}
.pt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem;text-align:start;display:flex;flex-direction:column;gap:.25rem;position:relative;transition:border-color .12s,transform .08s}
.pt:hover{border-color:var(--pri)}.pt:active{transform:scale(.97)}
.pt .ph{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:center;font-size:2.3rem;background:var(--tint,var(--priS));overflow:hidden}
.pt .ph img{width:100%;height:100%;object-fit:cover}
.pt .nm{font-weight:600;font-size:.88rem;line-height:1.35;min-height:2.4em}
.pt .pr{font-family:'Lalezar',sans-serif;font-size:1.15rem;color:var(--pri)}
.pt .st{position:absolute;top:.75rem;inset-inline-end:.75rem}
.pt.out{opacity:.55}
.cartp{position:sticky;top:70px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 86px);overflow:hidden}
.cartp .ch{padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line)}
.cartp .ch h3{font-size:1.25rem}
.lines{position:relative;overflow:auto;min-height:110px;flex:1}
.lines::before{content:'';position:absolute;inset-block:0;inset-inline-start:38px;width:2px;background:var(--red);opacity:.35;pointer-events:none}
.cl{display:grid;grid-template-columns:auto 1fr auto auto;gap:.5rem;align-items:center;padding:.5rem .6rem;border-bottom:1px solid var(--rule)}
.cl .cn{min-width:0}.cl .cn b{display:block;font-size:.9rem;line-height:1.3}.cl .cn small{color:var(--mute)}
.qs{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qs button{width:28px;height:30px;font-size:1.1rem;background:var(--paper)}
.qs input{width:38px;text-align:center;border:0;background:var(--card);height:30px;font-weight:600}
.ct{font-weight:600;min-width:64px;text-align:end}
.cf{padding:.8rem .9rem;border-top:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:.55rem}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot.g b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.9rem;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%);padding:0 .35rem;color:var(--ink)}
[data-theme=dark] .tot.g b{color:#fff;background:linear-gradient(transparent 55%,rgba(255,228,92,.28) 55% 92%,transparent 92%)}
.cartbar{display:none}
.quick{display:flex;gap:.35rem;flex-wrap:wrap}
.quick button{padding:.2rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:.82rem}
/* tasks */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
.bcol{background:var(--rule);border-radius:14px;padding:.6rem;min-height:220px;transition:outline .1s}
.bcol.over{outline:2px dashed var(--pri);outline-offset:-2px}
.bcol h4{font-size:1.15rem;padding:.2rem .4rem .6rem;display:flex;justify-content:space-between;align-items:center}
.tk{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--pc,var(--line));border-radius:8px;padding:.6rem .75rem;margin-bottom:.5rem;cursor:grab;display:flex;flex-direction:column;gap:.35rem}
.tk:hover{border-color:var(--pri);border-inline-start-color:var(--pc)}
.tk.done .tt{text-decoration:line-through;color:var(--mute)}
.tk .tt{font-weight:600;line-height:1.4}
.tk .tm{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--mute)}
/* store */
.st-h{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem}
.st-h .brand{font-size:1.5rem;display:flex;align-items:center;gap:.5rem;color:var(--pri)}
.st-w{max-width:1200px;margin:0 auto;padding:1rem 1.2rem 4rem}
.hero{--u:40px;padding:2rem 1.5rem 2rem 2rem;padding-inline-start:124px;padding-inline-end:56px;margin-bottom:1.4rem;min-height:calc(var(--u)*8)}
.hero h1{font-size:clamp(2rem,5.2vw,3.7rem);line-height:calc(var(--u)*2);color:var(--pri);margin-top:calc(var(--u)*-.2)}
.hero p{line-height:var(--u);max-width:34rem;color:var(--ink2)}
.hero .row{margin-top:var(--u)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-top:1rem}
.sp1{display:flex;flex-direction:column;gap:.3rem}
.sp1 .ph{aspect-ratio:1;border-radius:14px 14px 4px 14px;display:grid;place-items:center;font-size:3.6rem;background:var(--tint,var(--priS));overflow:hidden;position:relative}
.sp1 .ph img{width:100%;height:100%;object-fit:cover}
.sp1 .nm{font-weight:600;line-height:1.35}
.sp1 .pr{font-family:'Lalezar',sans-serif;font-size:1.25rem;color:var(--pri)}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(420px,100%);background:var(--card);z-index:90;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(8,14,38,.35);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.wa{position:fixed;bottom:1rem;inset-inline-end:1rem;z-index:50;background:#25D366;color:#fff;border-radius:99px;padding:.65rem 1.1rem;font-weight:600;display:flex;gap:.4rem;align-items:center}
/* print */
#print{display:none}
.rc{width:76mm;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#000;font-size:12px;line-height:1.5}
.rc h2{text-align:center;font-size:20px;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-weight:600}
.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rc table{width:100%}.rc td,.rc th{padding:1px 2px;border:0;font-size:12px;background:none;color:#000}
.rc .t{display:flex;justify-content:space-between}.rc .t.g{font-size:16px;font-weight:700}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}@page{margin:4mm}}
/* responsive */
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr)}.cartp{position:fixed;inset-inline:0;bottom:0;top:auto;max-height:86vh;border-radius:18px 18px 0 0;z-index:70;transform:translateY(110%);transition:transform .22s}.cartp.open{transform:none}.cartbar{display:flex;position:fixed;inset-inline:.8rem;bottom:.8rem;z-index:65;background:var(--side);color:#fff;border-radius:14px;padding:.8rem 1.1rem;justify-content:space-between;align-items:center;font-weight:600;box-shadow:0 8px 24px rgba(8,14,38,.35)}.cartbar b{color:var(--hl);font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.3rem}.c21,.c3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px),(pointer:coarse) and (max-width:1200px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none;position:fixed;inset-block:0;inset-inline-start:0;width:260px;height:100dvh}.side.open{display:flex;box-shadow:0 0 0 100vmax rgba(8,14,38,.5)}.menu{display:inline-flex}.main{padding:1rem .9rem 6rem}.board{grid-template-columns:minmax(0,1fr)}.top{padding:.55rem .8rem}.c2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.userpill{display:none}.top{gap:.4rem;padding:.5rem .6rem}.top h2{font-size:1.25rem}.pill{padding:.25rem .6rem;font-size:.8rem}.g2,.g3{grid-template-columns:minmax(0,1fr)}.hero{--u:32px;padding-inline-start:84px;padding-inline-end:44px}.sheet::before{inset-inline-start:52px}.authc{padding-inline-start:80px;padding-inline-end:44px}.sgrid{grid-template-columns:repeat(2,1fr);gap:.7rem}.ph1 h1{font-size:1.5rem}.st-h .in{min-width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:grid;place-items:center;color:#7481A3;font-family:sans-serif">جاري التحميل…</div></div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<div id="print"></div>
<script>
'use strict';
/* ============ إعدادات Firebase ============
   الصق هنا إعدادات مشروعك (نفس التي كانت في النسخة القديمة)، مثال:
   const FIREBASE_CONFIG={apiKey:"...",authDomain:"...",projectId:"...",storageBucket:"...",messagingSenderId:"...",appId:"..."};
   وإذا تركتها null يعمل النظام على هذا الجهاز فقط (تخزين محلي). */
const FIREBASE_CONFIG=null;

/* ============ أدوات عامة ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>new Intl.NumberFormat('en-US').format(Math.round(+n||0));
const money=n=>fmt(n)+' '+S().cur;
const pad=n=>String(n).padStart(2,'0');

const COLS=['products','sales','customers','tasks','users','expenses','shifts','payments','orders','settings'];
const DB={mode:'local',c:{},subs:[],fs:null,watching:new Set(),err:'',
list(c){return this.c[c]||[]},
get(c,id){return this.list(c).find(x=>x.id===id)},
on(f){this.subs.push(f)},
emit(c){clearTimeout(this._t);this._t=setTimeout(()=>this.subs.forEach(f=>f(c)),60)},
loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})},
async init(){
  COLS.forEach(c=>this.c[c]=[]);
  let cfg=FIREBASE_CONFIG;try{cfg=cfg||JSON.parse(localStorage.rm_fbcfg||'null')}catch(e){}
  if(cfg&&cfg.projectId){
    try{
      const v='10.12.2';
      if(!window.firebase){await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)}
      if(!firebase.apps.length)firebase.initializeApp(cfg);
      this.fs=firebase.firestore();
      try{await this.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
      this.mode='cloud';
    }catch(e){console.warn(e);this.err='تعذّر الاتصال بـ Firebase — يعمل النظام محلياً على هذا الجهاز'}
  }
  if(this.mode==='local'){
    COLS.forEach(c=>{try{this.c[c]=JSON.parse(localStorage['rm_'+c]||'[]')}catch(e){this.c[c]=[]}});
    addEventListener('storage',e=>{const c=e.key&&e.key.startsWith('rm_')?e.key.slice(3):'';if(COLS.includes(c)){try{this.c[c]=JSON.parse(e.newValue||'[]')}catch(x){}this.emit(c)}});
  }
},
watch(cols){
  const ps=[];
  cols.forEach(c=>{
    if(this.watching.has(c))return;this.watching.add(c);
    if(this.mode!=='cloud')return;
    ps.push(new Promise(ok=>{
      let first=true;const done=()=>{if(first){first=false;ok()}};
      this.fs.collection(c).onSnapshot(s=>{this.c[c]=s.docs.map(d=>({...d.data(),id:d.id,_fid:d.id}));done();this.emit(c)},e=>{console.warn(c,e.code);done()});
      setTimeout(done,5000);
    }));
  });
  return Promise.all(ps);
},
clean(o){return JSON.parse(JSON.stringify(o))},
persist(c){try{localStorage['rm_'+c]=JSON.stringify(this.c[c])}catch(e){toast('امتلأت مساحة التخزين المحلي — اربط Firebase أو احذف الصور','err')}},
save(c,o){
  o=this.clean(o);o.id=o.id||uid();o._fid=o.id;o.updatedAt=Date.now();o.createdAt=o.createdAt||o.updatedAt;
  if(this.mode==='cloud'){this.fs.collection(c).doc(o.id).set(o,{merge:true}).catch(e=>toast('تعذّر الحفظ: '+(e.code||e.message),'err'))}
  else{const a=this.list(c),i=a.findIndex(x=>x.id===o.id);if(i<0)a.push(o);else a[i]={...a[i],...o};this.c[c]=a;this.persist(c);this.emit(c)}
  return o;
},
remove(c,id){
  if(this.mode==='cloud')this.fs.collection(c).doc(id).delete().catch(e=>toast('تعذّر الحذف: '+(e.code||e.message),'err'));
  else{this.c[c]=this.list(c).filter(x=>x.id!==id);this.persist(c);this.emit(c)}
},
/* ops: {t:'set',col,doc} | {t:'inc',col,id,f:{field:delta}} | {t:'del',col,id} */
batch(ops){
  if(this.mode==='cloud'){
    const F=firebase.firestore.FieldValue;
    for(let i=0;i<ops.length;i+=400){
      const b=this.fs.batch();
      ops.slice(i,i+400).forEach(p=>{
        const r=this.fs.collection(p.col).doc(p.id||p.doc.id);
        if(p.t==='set'){const d=this.clean(p.doc);d._fid=d.id;d.updatedAt=Date.now();b.set(r,d,{merge:true})}
        else if(p.t==='inc'){const u={};for(const k in p.f)u[k]=F.increment(p.f[k]);b.set(r,u,{merge:true})}
        else if(p.t==='del')b.delete(r);
      });
      b.commit().catch(e=>toast('تعذّر الحفظ: '+(e.code||e.message),'err'));
    }
    return;
  }
  const touched=new Set();
  ops.forEach(p=>{
    const a=this.list(p.col);touched.add(p.col);
    if(p.t==='set'){const d=this.clean(p.doc);d._fid=d.id;d.updatedAt=Date.now();const i=a.findIndex(x=>x.id===d.id);if(i<0)a.push(d);else a[i]={...a[i],...d}}
    else if(p.t==='inc'){const x=a.find(x=>x.id===p.id);if(x)for(const k in p.f)x[k]=(x[k]||0)+p.f[k]}
    else if(p.t==='del')this.c[p.col]=a.filter(x=>x.id!==p.id);
  });
  touched.forEach(c=>this.persist(c));this.emit();
}};

function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}

function shiftCalc(sh){
  const ss=DB.list('sales').filter(s=>s.shiftId===sh.id&&s.status!=='refunded');
  const r={opening:sh.opening||0,n:ss.length,total:0,cash:0,transfer:0,credit:0,down:0,debtPay:0,ins:0,outs:0};
  ss.forEach(s=>{r.total+=s.total;if(s.method==='cash')r.cash+=s.total;else if(s.method==='transfer')r.transfer+=s.total;else{r.credit+=s.due||0;r.down+=s.paid||0}});
  DB.list('payments').filter(p=>p.shiftId===sh.id&&p.method==='cash').forEach(p=>r.debtPay+=p.amount);
  (sh.moves||[]).forEach(m=>{if(m.type==='in')r.ins+=m.amount;else r.outs+=m.amount});
  r.expected=r.opening+r.cash+r.down+r.debtPay+r.ins-r.outs;
  return r;
}

document.addEventListener('click',e=>{const sd=$('#side');if(sd&&sd.classList.contains('open')&&!e.target.closest('#side')&&!e.target.closest('[data-act=menu]'))sd.classList.remove('open')});
Act.logout=()=>{Auth.logout();location.hash='#/admin';renderLogin()};

async function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]!=='admin'){Store.render();return}
  if(!Auth.user){
    await DB.watch(COLS);
    if(!DB.list('users').length){renderSetup();return}
    if(!Auth.restore()){renderLogin();return}
  }
  const nv=h[1]||(NAV.some(n=>n.id===VIEW)?VIEW:'dash');
  if(nv!==VIEW)scrollTo(0,0);
  VIEW=nv;renderApp();
}
addEventListener('hashchange',route);
function onData(){
  if($$('.mdl').length)return;
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(location.hash.startsWith('#/admin')){if(Auth.user)refreshView()}else if(Store.refresh)Store.refresh();
}

const authShell=(inner)=>`<div class="auth"><div class="sheet authc" style="--u:36px"><div class="disp" style="display:flex;align-items:center;gap:.6rem;color:var(--red);margin-bottom:.4rem">${I('book',28)}</div>${inner}<p class="sm mute" style="margin-top:1rem"><a href="#/" style="text-decoration:underline">العودة إلى المتجر</a></p></div></div>`;
function renderLogin(){
  $('#root').innerHTML=authShell(`<h1>${esc(S().name)}</h1><p class="mute" style="margin-bottom:1.2rem">تسجيل دخول الموظفين</p>
  <form data-sub="login"><label class="f"><span>اسم المستخدم</span><input class="in" name="u" autocomplete="username" autocapitalize="off" required></label>
  <label class="f"><span>كلمة المرور</span><input class="in" name="p" type="password" autocomplete="current-password" required></label>
  <button class="btn pri lg" style="width:100%">دخول</button><p id="lerr" class="sm" style="color:var(--red);margin-top:.5rem"></p></form>`);

}
Sub.login=async f=>{
  const d=Object.fromEntries(new FormData(f));
  if(await Auth.login(d.u,d.p)){VIEW=NAV.find(n=>n.r.includes(Auth.user.role)).id;location.hash='#/admin/'+VIEW;route()}
  else{$('#lerr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';f.elements.p.select()}
};
function renderSetup(){
  $('#root').innerHTML=authShell(`<h1>أهلاً بك</h1><p class="mute" style="margin-bottom:1.1rem">أنشئ حساب المدير لتبدأ إدارة المكتبة.</p>
  <form data-sub="setup"><label class="f"><span>اسم المكتبة</span><input class="in" name="shop" value="${esc(DEF.name)}" required></label>
  <label class="f"><span>اسمك</span><input class="in" name="name" required></label>
  <div class="g2"><label class="f"><span>اسم المستخدم</span><input class="in" name="u" autocapitalize="off" required></label>
  <label class="f"><span>كلمة المرور (6 أحرف فأكثر)</span><input class="in" name="p" type="password" minlength="6" required></label></div>
  <button class="btn pri lg" style="width:100%">إنشاء الحساب والبدء</button></form>`);

Sub.setup=async f=>{
  const d=Object.fromEntries(new FormData(f));
  DB.save('settings',{...S(),id:'main',name:d.shop.trim()});
  const saved=DB.save('users',await Auth.make(d.name.trim(),d.u,'admin',d.p));
  Auth.user=saved;localStorage.rm_sess=JSON.stringify({id:saved.id,t:Date.now()});
  VIEW='dash';location.hash='#/admin/dash';route();
};

const paintPill=()=>{

function renderView(){

/* ============ الرئيسية ============ */
function barChart(d){
  const W=560,H=212,pt=24,pb=30,ph=H-pt-pb,max=Math.max(...d.map(x=>x.v),1),bw=W/d.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="مبيعات آخر 7 أيام">`+
  [0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${pt+ph*(1-f)}" y2="${pt+ph*(1-f)}" stroke="var(--line)" stroke-dasharray="3 5"/>`).join('')+
  d.map((x,i)=>{const h=ph*x.v/max,xx=i*bw+bw*.2,y=pt+ph-h;
    return `<rect x="${xx}" y="${y}" width="${bw*.6}" height="${Math.max(h,3)}" rx="6" fill="${x.today?'var(--hl)':'var(--pri)'}" ${x.today?'stroke="var(--ink)" stroke-width="1.5"':''}/>
    <text x="${xx+bw*.3}" y="${y-7}" text-anchor="middle" font-size="12" fill="var(--ink2)">${x.v?short(x.v):''}</text>
    <text x="${xx+bw*.3}" y="${H-9}" text-anchor="middle" font-size="12.5" fill="var(--mute)">${x.l}</text>`}).join('')+`</svg>`;
}
const methodName={cash:'نقد',credit:'آجل',transfer:'تحويل'};

  const u=Auth.user,adm=u.role==='admin',cash=['admin','cashier'].includes(u.role),today=sod();

  const days=[...Array(7)].map((_,i)=>{const s=today-i*DAY;return{l:i?DAYS[new Date(s).getDay()]:'اليوم',v:Q.agg(Q.sales(s,s+DAY)).total,today:!i}});
  const recent=[...DB.list('sales')].sort((a,b)=>b.ts-a.ts).slice(0,6);
  const wk={};Q.sales(today-6*DAY).forEach(s=>s.items.forEach(i=>{const k=i.pid;wk[k]=wk[k]||{n:i.name,q:0,v:0};wk[k].q+=i.qty;wk[k].v+=i.qty*i.price}));

  ${fresh&&adm?`<div class="card" style="margin-bottom:1rem;border-style:dashed"><h3>ابدأ من هنا</h3><p class="mute" style="margin-bottom:.8rem">أضف منتجاتك ثم افتح الوردية وابدأ البيع. ولتجربة النظام قبل إدخال بياناتك، حمّل بيانات تجريبية (تُحذف بضغطة واحدة لاحقاً).</p><div class="row"><button class="btn pri" data-act="go" data-v="products">أضف منتجاتك</button><button class="btn" data-act="seed">حمّل بيانات تجريبية</button><button class="btn" data-act="openShift">افتح الوردية</button></div></div>`:''}
  <div class="kpis">
   ${cash?`<div class="kpi big"><small>مبيعات اليوم</small><b>${fmt(td.total)} <span style="font-size:1rem">${S().cur}</span></b><small>${td.n} فاتورة${yd.total?` • أمس ${fmt(yd.total)}`:''}</small></div>`:''}
   ${adm?`<div class="kpi"><small>ربح اليوم</small><b>${fmt(td.profit)}</b><small>${td.total?Math.round(td.profit/td.total*100)+'% هامش':'—'}</small></div>`:''}
   ${cash?`<div class="kpi"><small>النقد المتوقع في الدرج</small><b>${sh?fmt(shiftCalc(sh).expected):'—'}</b><small>${sh?'وردية '+esc(sh.byName||''):'الصندوق مغلق'}</small></div>`:''}
   ${cash?`<div class="kpi"><small>ديون العملاء</small><b>${fmt(Q.debts())}</b><small>${DB.list('customers').filter(c=>c.balance>0).length} عميل</small></div>`:''}
   <div class="kpi"><small>منتجات تحتاج إعادة طلب</small><b>${Q.low().length}</b><small>من ${DB.list('products').filter(p=>!p.service).length} صنف</small></div>
  </div>
  <div class="cgrid c21">
   ${cash?`<div class="card"><h3>مبيعات آخر 7 أيام</h3>${barChart(days)}</div>`:`<div class="card"><h3>المهام</h3>${tasksMini(tasks)}</div>`}
   <div class="card"><h3>تنبيهات المخزون</h3>${low.length?`<div class="list">${low.map(p=>`<div class="li"><span style="font-size:1.4rem">${catOf(p.cat).e}</span><div style="flex:1;min-width:0"><div class="b">${esc(p.name)}</div><span class="bd ${p.stock<=0?'red':'warn'}">${p.stock<=0?'نفد':'المتبقي '+p.stock}</span></div><button class="btn s" data-act="lowtask" data-id="${p.id}" title="إنشاء مهمة إعادة طلب">${I('plus',15)}مهمة</button></div>`).join('')}</div>${Q.low().length>1?`<button class="btn s" style="margin-top:.6rem" data-act="lowtaskAll">مهام إعادة طلب لكل النواقص</button>`:''}`:empty('✅','المخزون بحالة جيدة','لا توجد أصناف تحت حد إعادة الطلب')}</div>
  </div>
  <div class="cgrid c3" style="margin-top:1rem">
   ${cash?`<div class="card"><h3>المهام المفتوحة</h3>${tasksMini(tasks)}</div>`:''}
   ${cash?`<div class="card"><h3>آخر الفواتير</h3>${recent.length?`<div class="list">${recent.map(s=>`<div class="li"><div style="flex:1"><div class="b">#${s.no} <span class="bd ${s.status==='refunded'?'red':'mute'}">${s.status==='refunded'?'مرتجعة':methodName[s.method]}</span></div><span class="sm mute">${tm(s.ts)} • ${esc(s.custName||'زبون عام')}</span></div><b>${fmt(s.total)}</b></div>`).join('')}</div>`:empty('🧾','لا فواتير بعد')}</div>

  </div>`;
}};
const tasksMini=t=>t.length?`<div class="list">${t.map(k=>`<div class="li"><button class="btn ic1 s" data-act="tdone" data-id="${k.id}" aria-label="إنجاز" style="border:1.5px solid var(--line);border-radius:6px;min-width:26px;min-height:26px;padding:0"></button><div style="flex:1;min-width:0"><div class="b">${esc(k.title)}</div>${k.due?`<span class="sm ${k.due<ymd(Date.now())?'':'mute'}" style="${k.due<ymd(Date.now())?'color:var(--red)':''}">${k.due<ymd(Date.now())?'متأخرة • ':''}${k.due}</span>`:''}</div></div>`).join('')}</div><button class="btn s" style="margin-top:.6rem" data-act="go" data-v="tasks">كل المهام</button>`:empty('🎉','لا مهام مفتوحة','أنشئ مهمة جديدة لتتبع عملك');

/* ============ الوردية والصندوق النقدي ============ */
Act.openShift=()=>{
  if(Q.shift())return Act.shift();
  const last=DB.list('shifts').filter(s=>s.status==='closed').sort((a,b)=>b.closedAt-a.closedAt)[0];
  const m=modal({title:'فتح الوردية',body:`<form id="f1"><label class="f"><span>النقد الافتتاحي في الدرج (${S().cur})</span><input class="in" name="open" inputmode="numeric" value="${last?last.counted:0}" required></label><p class="sm mute">عدّ النقد الموجود فعلياً قبل البدء. سيُقارن به عند إغلاق الوردية.</p></form>`,foot:`<button class="btn pri" form="f1">فتح الوردية</button>`});
  form(m,d=>{DB.save('shifts',{status:'open',openedAt:Date.now(),by:Auth.user.id,byName:Auth.user.name,opening:num(d.open),moves:[]});toast('تم فتح الوردية','ok')});
};
Act.shift=()=>{
  const sh=Q.shift();if(!sh)return Act.openShift();
  const c=shiftCalc(sh),row=(a,b,cl='')=>`<tr><td>${a}</td><td class="e ${cl}">${b}</td></tr>`;
  const m=modal({title:'الصندوق — الوردية الحالية',wide:1,body:`<div class="cgrid c2"><div><div class="mute sm" style="margin-bottom:.4rem">بدأت ${tm(sh.openedAt)} • ${esc(sh.byName||'')}</div>
  <div class="tblw"><table><tbody>${row('النقد الافتتاحي',fmt(c.opening))}${row('مبيعات نقدية (+)',fmt(c.cash))}${row('دفعات مقدمة على فواتير آجلة (+)',fmt(c.down))}${row('تسديد ديون عملاء (+)',fmt(c.debtPay))}${row('إيداعات (+)',fmt(c.ins))}${row('سحوبات ومصروفات (−)',fmt(c.outs))}
  <tr style="background:var(--hlS)"><td class="b">النقد المتوقع في الدرج</td><td class="e b" style="font-size:1.2rem">${fmt(c.expected)} ${S().cur}</td></tr></tbody></table></div></div>
  <div><div class="tblw"><table><tbody>${row('عدد الفواتير',c.n)}${row('إجمالي المبيعات',fmt(c.total))}${row('تحويل إلكتروني',fmt(c.transfer))}${row('آجل (ديون جديدة)',fmt(c.credit))}</tbody></table></div>
  <h4 style="margin:.9rem 0 .3rem;font-size:1.05rem">حركات الدرج</h4>${(sh.moves||[]).length?`<div class="list">${sh.moves.map(x=>`<div class="li"><span class="bd ${x.type==='in'?'ok':'red'}">${x.type==='in'?'إيداع':'سحب'}</span><span style="flex:1">${esc(x.reason||'')}<span class="sm mute"> • ${tm(x.ts)}</span></span><b>${fmt(x.amount)}</b></div>`).join('')}</div>`:'<div class="sm mute">لا حركات بعد</div>'}</div></div>`,
  foot:`<button class="btn red" data-act="closeShift">إغلاق الوردية</button><button class="btn" data-act="move" data-type="in">${I('plus',16)}إيداع</button><button class="btn" data-act="move" data-type="out">${I('minus',16)}سحب / مصروف</button><button class="btn" data-act="printZ">${I('print',16)}طباعة</button>`});
  m.dataset.shift=sh.id;
};
Act.move=el=>{
  const sh=Q.shift(),type=el.dataset.type;if(!sh)return;
  const m=modal({title:type==='in'?'إيداع نقد في الدرج':'سحب نقد من الدرج',body:`<form id="f2"><label class="f"><span>المبلغ (${S().cur})</span><input class="in" name="a" inputmode="numeric" required></label><label class="f"><span>السبب</span><input class="in" name="r" placeholder="${type==='in'?'مثال: فكّة':'مثال: شراء أكياس، توصيل'}" required></label></form>`,foot:`<button class="btn pri" form="f2">حفظ</button>`});
  form(m,d=>{const a=num(d.a);if(a<=0){toast('أدخل مبلغاً صحيحاً','err');return false}
    DB.save('shifts',{...sh,moves:[...(sh.moves||[]),{ts:Date.now(),type,amount:a,reason:d.r,by:Auth.user.name}]});
    closeModal(el.closest('.mdl'));setTimeout(Act.shift,350)});
};
Act.closeShift=el=>{
  const sh=Q.shift();if(!sh)return;const c=shiftCalc(sh);
  const m=modal({title:'إغلاق الوردية',body:`<form id="f3"><div class="kpi" style="margin-bottom:1rem"><small>النقد المتوقع</small><b>${fmt(c.expected)} ${S().cur}</b></div>
  <label class="f"><span>النقد الفعلي بعد العدّ (${S().cur})</span><input class="in" name="cnt" inputmode="numeric" data-in="diff" data-exp="${c.expected}" required></label>
  <div id="dv" class="b" style="margin-bottom:.8rem"></div><label class="f"><span>ملاحظات (اختياري)</span><input class="in" name="note"></label></form>`,foot:`<button class="btn red" form="f3">إغلاق الوردية</button><button class="btn" data-act="close">رجوع</button>`});
  form(m,d=>{const cnt=num(d.cnt),nsh={...sh,status:'closed',closedAt:Date.now(),closedBy:Auth.user.name,expected:c.expected,counted:cnt,diff:cnt-c.expected,note:d.note||''};
    DB.save('shifts',nsh);$$('.mdl').forEach(closeModal);
    modal({title:'تم إغلاق الوردية',body:`<p>الفرق بين العدّ الفعلي والمتوقع: <b style="color:${nsh.diff?'var(--red)':'var(--ok)'}">${nsh.diff>0?'+':''}${fmt(nsh.diff)} ${S().cur}</b></p>`,foot:`<button class="btn pri" data-act="printZ" data-id="${sh.id}">${I('print',16)}طباعة تقرير الوردية</button><button class="btn" data-act="close">تم</button>`});return false});
};
In.diff=el=>{const d=num(el.value)-num(el.dataset.exp);$('#dv').innerHTML=el.value===''?'':`الفرق: <span style="color:${d?'var(--red)':'var(--ok)'}">${d>0?'+':''}${fmt(d)}</span>${d?'':' ✓ مطابق'}`};
function printHTML(h){$('#print').innerHTML=h;setTimeout(()=>window.print(),120)}
Act.printZ=el=>{
  const id=el.dataset.id||(el.closest('.mdl')||{dataset:{}}).dataset.shift;const sh=DB.get('shifts',id)||Q.shift();if(!sh)return;
  const c=shiftCalc(sh),r=(a,b)=>`<div class="t"><span>${a}</span><span>${fmt(b)}</span></div>`;
  printHTML(`<div class="rc"><h2>${esc(S().name)}</h2><div class="c">تقرير الوردية</div><hr>
  <div>الموظف: ${esc(sh.byName||'')}</div><div>البداية: ${dt(sh.openedAt)} ${tm(sh.openedAt)}</div>${sh.closedAt?`<div>النهاية: ${dt(sh.closedAt)} ${tm(sh.closedAt)}</div>`:''}<hr>
  ${r('عدد الفواتير',c.n)}${r('إجمالي المبيعات',c.total)}${r('نقدي',c.cash)}${r('تحويل',c.transfer)}${r('آجل',c.credit)}<hr>
  ${r('النقد الافتتاحي',c.opening)}${r('+ مبيعات نقدية',c.cash)}${r('+ دفعات مقدمة',c.down)}${r('+ تسديد ديون',c.debtPay)}${r('+ إيداعات',c.ins)}${r('− سحوبات',c.outs)}<hr>

const POS={cart:[],disc:0,dtype:'amt',cust:null,method:'cash',tender:'',down:0,q:'',cat:'all',orderId:null,busy:false};
const held=()=>{try{return JSON.parse(localStorage.rm_held||'[]')}catch(e){return[]}};
const setHeld=h=>{localStorage.rm_held=JSON.stringify(h)};
function resetPos(){Object.assign(POS,{cart:[],disc:0,dtype:'amt',cust:null,method:'cash',tender:'',down:0,orderId:null,busy:false})}
function posTot(){
  const sub=POS.cart.reduce((a,l)=>a+l.price*l.qty,0);
  let d=POS.dtype==='pct'?sub*Math.min(POS.disc,100)/100:POS.disc;
  d=Math.round(Math.min(Math.max(d||0,0),sub));
  return{sub,d,total:sub-d};
}
function posList(){
  const q=POS.q.trim().toLowerCase(),sold={},from=Date.now()-30*DAY;
  DB.list('sales').forEach(s=>{if(s.ts>from)s.items.forEach(i=>sold[i.pid]=(sold[i.pid]||0)+i.qty)});
  return DB.list('products').filter(p=>p.active!==false&&(POS.cat==='all'||p.cat===POS.cat)&&(!q||p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q)))
    .sort((a,b)=>(sold[b.id]||0)-(sold[a.id]||0)||a.name.localeCompare(b.name,'ar'));

Act.pay=()=>{
  if(!POS.cart.length||POS.busy)return;
  const sh=Q.shift();if(!sh){toast('افتح الوردية أولاً','err');return Act.openShift()}
  const t=posTot(),m=POS.method;let paid=0,due=0,tender=0,change=0;
  if(m==='cash'){tender=POS.tender===''?t.total:num(POS.tender);if(tender<t.total){toast('المبلغ المستلم أقل من الإجمالي','err');return}paid=t.total;change=tender-t.total}
  else if(m==='transfer'){paid=t.total}
  else{if(!POS.cust){toast('اختر العميل للبيع الآجل','err');return}paid=Math.min(POS.down||0,t.total);due=t.total-paid}
  POS.busy=true;
  const cu=POS.cust&&DB.get('customers',POS.cust),no=Math.max(0,...DB.list('sales').map(s=>s.no||0))+1;
  const sale={id:uid(),no,ts:Date.now(),by:Auth.user.id,byName:Auth.user.name,shiftId:sh.id,
    items:POS.cart.map(l=>({pid:l.pid,name:l.name,qty:l.qty,price:l.price,cost:l.cost,service:l.service})),
    subtotal:t.sub,discount:t.d,total:t.total,method:m,paid,due,tender,change,custId:cu?cu.id:'',custName:cu?cu.name:'',orderId:POS.orderId||'',status:'ok'};
  const ops=[{t:'set',col:'sales',doc:sale}];
  sale.items.filter(i=>!i.service).forEach(i=>{if(DB.get('products',i.pid))ops.push({t:'inc',col:'products',id:i.pid,f:{stock:-i.qty}})});
  if(due>0&&cu)ops.push({t:'inc',col:'customers',id:cu.id,f:{balance:due}});
  if(POS.orderId){const o=DB.get('orders',POS.orderId);if(o)ops.push({t:'set',col:'orders',doc:{...o,status:'done',saleId:sale.id}})}

  const ops=[{t:'set',col:'sales',doc:{...s,status:'refunded',refundedAt:Date.now(),refundedBy:Auth.user.name}}];
  s.items.filter(i=>!i.service).forEach(i=>{if(DB.get('products',i.pid))ops.push({t:'inc',col:'products',id:i.pid,f:{stock:i.qty}})});
  if(s.due>0&&s.custId)ops.push({t:'inc',col:'customers',id:s.custId,f:{balance:-s.due}});

};

const PRI={high:['عاجلة','var(--red)'],med:['متوسطة','var(--warn)'],low:['عادية','var(--mute)']};

const RF={p:'month',from:'',to:''};
function rRange(){
  const t=sod(),d=new Date(),ms=new Date(d.getFullYear(),d.getMonth(),1).getTime();
  switch(RF.p){case'today':return[t,t+DAY];case'yest':return[t-DAY,t];case'7':return[t-6*DAY,t+DAY];
    case'month':return[ms,t+DAY];case'last':return[new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),ms];
    default:return[new Date((RF.from||ymd(t))+'T00:00').getTime(),new Date((RF.to||ymd(t))+'T00:00').getTime()+DAY]}
}

/* ============ المتجر العام (للزبائن) ============ */
const Store={
  cat:'all',q:'',m:null,
  cart:(()=>{try{return JSON.parse(localStorage.rm_scart||'[]')}catch(e){return[]}})(),
  keep(){localStorage.rm_scart=JSON.stringify(this.cart)},
  items(){return DB.list('products').filter(p=>p.active!==false&&!p.service&&p.price>0)},
  qty(id){const l=this.cart.find(x=>x.pid===id);return l?l.qty:0},
  count(){return this.cart.reduce((a,l)=>a+l.qty,0)},
  total(){return this.cart.reduce((a,l)=>{const p=DB.get('products',l.pid);return a+(p?p.price:0)*l.qty},0)},
  render(){
    const s=S();document.title=s.name;
    $('#root').innerHTML=`<header class="st-h"><a class="brand" href="#/"><span style="width:34px;height:34px;border-radius:8px;background:#fff;border:1px solid var(--line);border-inline-start:6px double var(--red);display:grid;place-items:center;color:var(--pri)">${I('book',18)}</span><span>${esc(s.name)}</span></a>
    <input class="in" data-in="sq" placeholder="ابحث عن دفتر، كتاب، قلم…" style="flex:1;max-width:460px" value="${esc(this.q)}" aria-label="بحث">
    <span class="sp"></span><button class="btn pri" id="scb" data-act="scart">${I('cart',18)}<span>السلة</span><span class="bd hl" id="scn" style="background:var(--hl);color:#0F1F4D"></span></button>
    <button class="btn ic1 ghost" data-act="theme" id="thm" aria-label="الوضع الداكن"></button><a class="btn ic1 ghost" href="#/admin" title="دخول الموظفين" aria-label="دخول الموظفين">${I('lock',18)}</a></header>
    <div class="st-w"><section class="sheet hero"><h1>${esc(s.name)}</h1><p>كتب مدرسية ودفاتر وأقلام وحقائب وكل قرطاسية الدوام. اطلب من هنا وتسلّم من المكتبة أو نوصّل الطلب إلى بيتك.</p>
    <div class="row"><button class="btn pri lg" data-act="sbrowse">تصفّح المنتجات</button>${s.phone?`<a class="btn lg" href="${waLink(s.phone,'مرحباً، أريد الاستفسار عن منتج')}" target="_blank" rel="noopener">${I('wa',20)}واتساب</a>`:''}</div></section>
    <div class="chips" id="scats"></div><div id="sgrid" class="sgrid"></div>
    <footer class="sm mute" style="margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line)"><b style="color:var(--ink)">${esc(s.name)}</b>${s.address?' • '+esc(s.address):''}${s.phone?' • '+esc(s.phone):''}</footer></div>
    ${s.phone?`<a class="wa" href="${waLink(s.phone,'مرحباً')}" target="_blank" rel="noopener" aria-label="واتساب">${I('wa',20)}<span>واتساب</span></a>`:''}`;
    paintTheme();this.paint();
  },
  refresh(){if($('#sgrid')&&!$$('.mdl').length)this.paint()},
  paint(){
    const g=$('#sgrid');if(!g)return;
    const used=new Set(this.items().map(p=>p.cat)),q=this.q.trim().toLowerCase();
    $('#scats').innerHTML=`<button class="chip ${this.cat==='all'?'on':''}" data-act="scat" data-id="all">الكل</button>`+S().cats.filter(c=>used.has(c.id)).map(c=>`<button class="chip ${this.cat===c.id?'on':''}" data-act="scat" data-id="${c.id}">${c.e} ${esc(c.n)}</button>`).join('');
    const l=this.items().filter(p=>(this.cat==='all'||p.cat===this.cat)&&(!q||p.name.toLowerCase().includes(q))).sort((a,b)=>((b.stock||0)>0)-((a.stock||0)>0)||a.name.localeCompare(b.name,'ar'));
    g.innerHTML=l.map(p=>{
      const c=catOf(p.cat),n=this.qty(p.id),out=(p.stock||0)<=0;
      return `<div class="sp1"><div class="ph" style="--tint:${c.c}">${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:c.e}${out?'<span class="bd red" style="position:absolute;top:.6rem;inset-inline-start:.6rem">غير متوفر</span>':''}</div><div class="nm">${esc(p.name)}</div>
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="pr">${fmt(p.price)} <small style="font-size:.8rem">${S().cur}</small></span>${out?'':n?`<div class="qs"><button data-act="sdec" data-id="${p.id}" aria-label="أنقص">−</button><input value="${n}" readonly aria-label="الكمية"><button data-act="sinc" data-id="${p.id}" aria-label="زد">+</button></div>`:`<button class="btn s pri" data-act="sinc" data-id="${p.id}">${I('plus',14)}أضف</button>`}</div></div>`;
    }).join('')||`<div style="grid-column:1/-1">${empty('📚',this.items().length?'لا نتائج':'المتجر قيد التجهيز','تابعنا قريباً أو تواصل معنا مباشرة')}</div>`;
    this.badge();
  },
  badge(){const n=this.count(),e=$('#scn');if(e){e.textContent=n||'';e.style.display=n?'':'none'}}
};
In.sq=el=>{Store.q=el.value;Store.paint()};
Act.scat=el=>{Store.cat=el.dataset.id;Store.paint()};
Act.sbrowse=()=>{const c=$('#scats');c&&c.scrollIntoView({behavior:'smooth',block:'start'})};
Act.sinc=el=>{
  const p=DB.get('products',el.dataset.id);if(!p)return;let l=Store.cart.find(x=>x.pid===p.id);
  if((l?l.qty:0)+1>(p.stock||0)){toast('الكمية المتوفرة من هذا المنتج: '+(p.stock||0),'err');return}
  if(l)l.qty++;else Store.cart.push({pid:p.id,qty:1});
  Store.keep();Store.paint();Store.paintCart&&Store.paintCart();
};
Act.sdec=el=>{const l=Store.cart.find(x=>x.pid===el.dataset.id);if(!l)return;if(--l.qty<=0)Store.cart=Store.cart.filter(x=>x!==l);Store.keep();Store.paint();Store.paintCart&&Store.paintCart()};
Act.srm=el=>{Store.cart=Store.cart.filter(x=>x.pid!==el.dataset.id);Store.keep();Store.paint();Store.paintCart()};
Store.paintCart=function(){
  const el=$('#slines');if(!el)return;
  this.cart=this.cart.filter(l=>DB.get('products',l.pid));
  el.innerHTML=this.cart.length?this.cart.map(l=>{const p=DB.get('products',l.pid);return `<div class="cl" style="grid-template-columns:auto 1fr auto auto"><button class="btn ic1 s ghost" data-act="srm" data-id="${p.id}" aria-label="حذف" style="color:var(--red)">${I('x',16)}</button><div class="cn"><b>${esc(p.name)}</b><small>${fmt(p.price)} ${S().cur}</small></div><div class="qs"><button data-act="sdec" data-id="${p.id}" aria-label="أنقص">−</button><input value="${l.qty}" readonly><button data-act="sinc" data-id="${p.id}" aria-label="زد">+</button></div><div class="ct">${fmt(p.price*l.qty)}</div></div>`}).join('')+`<div class="tot g" style="margin:.8rem 0"><span class="b">الإجمالي</span><b>${fmt(this.total())} ${S().cur}</b></div>`:empty('🛒','سلتك فارغة','أضف منتجات من المتجر لتبدأ');
  const b=$('#osub');if(b)b.disabled=!this.cart.length;
};
Act.scart=()=>{
  const m=modal({title:'سلة الطلب',wide:0,body:`<div id="slines"></div><form data-sub="order" id="ordf" style="margin-top:.6rem;padding-top:1rem;border-top:1px solid var(--line)"><b style="display:block;margin-bottom:.6rem">بيانات الاستلام</b>
  <div class="g2"><label class="f"><span>الاسم</span><input class="in" name="n" required autocomplete="name"></label><label class="f"><span>رقم الهاتف</span><input class="in" name="p" inputmode="tel" required pattern="[0-9٠-٩+ ]{10,15}" title="أدخل رقم هاتف صحيحاً" autocomplete="tel"></label></div>
  <div class="seg" style="margin-bottom:.9rem"><button type="button" class="on" data-act="odel" data-m="delivery">توصيل للبيت</button><button type="button" data-act="odel" data-m="pickup">استلام من المكتبة</button></div><input type="hidden" name="m" value="delivery">
  <label class="f" id="addrw"><span>العنوان (المنطقة وأقرب نقطة دالة)</span><input class="in" name="a"></label><label class="f"><span>ملاحظات (اختياري)</span><input class="in" name="t"></label>
  <button class="btn pri lg" id="osub" style="width:100%">إرسال الطلب</button><p class="sm mute" style="margin-top:.5rem">الدفع عند الاستلام. سنتواصل معك لتأكيد الطلب.</p></form>`});
  Store.m=m;m._close=()=>{Store.m=null;Store.paint()};Store.paintCart();
};
Act.odel=el=>{const f=el.closest('form');f.elements.m.value=el.dataset.m;$$('.seg button',f).forEach(b=>b.classList.toggle('on',b===el));$('#addrw').style.display=el.dataset.m==='delivery'?'':'none';f.elements.a.required=el.dataset.m==='delivery'};
Sub.order=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(!Store.cart.length){toast('السلة فارغة','err');return}
  const items=[];
  for(const l of Store.cart){const p=DB.get('products',l.pid);if(!p||l.qty>(p.stock||0)){toast('الكمية المطلوبة من «'+(p?p.name:'منتج')+'» غير متوفرة','err');return}items.push({pid:p.id,name:p.name,qty:l.qty,price:p.price})}
  const o={id:uid(),no:'W'+String(Date.now()).slice(-6),ts:Date.now(),name:d.n.trim(),phone:d.p.trim(),addr:d.m==='delivery'?d.a.trim():'',delivery:d.m,note:d.t.trim(),items,total:items.reduce((a,i)=>a+i.price*i.qty,0),status:'new',via:'store'};
  DB.save('orders',o);Store.cart=[];Store.keep();
  const m=Store.m;Store.m=null;if(m){m._close=null;m.remove()}
  const s=S(),msg=`طلب جديد ${o.no}\n${o.items.map(i=>`• ${i.name} × ${i.qty}`).join('\n')}\nالإجمالي: ${fmt(o.total)} ${s.cur}\nالاسم: ${o.name}\n${o.delivery==='delivery'?'العنوان: '+o.addr:'استلام من المكتبة'}`;
  modal({title:'وصلنا طلبك ✓',body:`<p style="margin-bottom:.6rem">رقم طلبك <b class="disp" style="font-size:1.4rem">${o.no}</b></p><p class="mute">الإجمالي ${fmt(o.total)} ${esc(s.cur)} — سنتواصل معك على ${esc(o.phone)} لتأكيد الطلب.</p>`,foot:`${s.phone?`<a class="btn pri" href="${waLink(s.phone,msg)}" target="_blank" rel="noopener">${I('wa',16)}أرسل تفاصيل الطلب على واتساب</a>`:''}<button class="btn" data-act="close">تم</button>`});
  Store.paint();
};

/* ============ التشغيل و PWA ============ */
function setupPWA(){
  try{
    const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0F1F4D"/><rect x="112" y="88" width="288" height="336" rx="26" fill="#fff"/><path d="M172 88v336" stroke="#D6344B" stroke-width="10"/><path d="M212 172h150M212 234h150M212 296h104" stroke="#1B3FA0" stroke-width="18" stroke-linecap="round"/></svg>');
    const l=document.createElement('link');l.rel='icon';l.href=icon;document.head.appendChild(l);
    const base=location.origin+location.pathname,mf={name:S().name,short_name:S().name.slice(0,14),start_url:base+'#/admin',scope:base.replace(/[^/]*$/,''),display:'standalone',background_color:'#0F1F4D',theme_color:'#0F1F4D',lang:'ar',dir:'rtl',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
    const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(k);
  }catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
(async function boot(){
  try{
    await DB.init();
    await DB.watch(['products','settings']);
    DB.on(onData);
    setupPWA();
    await route();
  }catch(e){
    console.error(e);
    $('#root').innerHTML=`<div class="auth"><div class="card" style="max-width:420px;text-align:center"><h3>تعذّر تشغيل النظام</h3><p class="mute" style="margin:.5rem 0 1rem">${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">إعادة المحاولة</button></div></div>`;
  }
})();
